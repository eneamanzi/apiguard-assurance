kong-5-1-identity-http-log:
  what: an http-log plugin on identity-service, shipping to http://127.0.0.1:9/validation (nothing listens)
  changes:
  - kind: kong_plugin_add
    service: identity-service
    plugin:
      name: http-log
      config:
        http_endpoint: http://127.0.0.1:9/validation

kong-6-2-headers-replace-only:
  what: the services' response-transformer sets X-Content-Type-Options and X-Frame-Options under replace only (no
    longer under add), as the lab was before 2026-11-05
  changes:
  - kind: kong_plugin_set
    service: identity-service
    plugin: response-transformer
    set:
      add:
        headers:
        - 'Strict-Transport-Security: max-age=31536000; includeSubDomains'
        - 'Content-Security-Policy: default-src ''self'''
        - 'Permissions-Policy: geolocation=(), camera=(), microphone=()'
  - kind: kong_plugin_set
    service: community-service
    plugin: response-transformer
    set:
      add:
        headers:
        - 'Strict-Transport-Security: max-age=31536000; includeSubDomains'
        - 'Content-Security-Policy: default-src ''self'''
        - 'Permissions-Policy: geolocation=(), camera=(), microphone=()'
  - kind: kong_plugin_set
    service: workshop-service
    plugin: response-transformer
    set:
      add:
        headers:
        - 'Strict-Transport-Security: max-age=31536000; includeSubDomains'
        - 'Content-Security-Policy: default-src ''self'''
        - 'Permissions-Policy: geolocation=(), camera=(), microphone=()'

kong-7-3-coupon-first-200-then-400:
  what: a route POST ~/workshop/api/shop/apply_coupon$ whose pre-function answers the first request 200 and every
    later one 400 'Coupon code is already claimed by you', reaching crAPI with none
  changes:
  - kind: kong_entity_add
    list: routes
    item:
      name: validation-7-3-apply-coupon
      service: workshop-service
      paths:
      - ~/workshop/api/shop/apply_coupon$
      methods:
      - POST
      strip_path: false
      protocols:
      - https
      plugins:
      - name: pre-function
        config:
          access:
          - local n = ngx.shared.kong:incr('v73_coupon', 1, 0) if n == 1 then return kong.response.exit(200, {credit
            = 10, message = 'Coupon successfully applied!'}) end return kong.response.exit(400, {message = 'Coupon
            code is already claimed by you'})

