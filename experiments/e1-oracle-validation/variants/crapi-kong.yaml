# Variants of the crAPI + Kong lab (test-environments/crapi-kong), applied and undone by experiments/e1-oracle-validation/run.py.

kong-0-4-workshop-key-auth:
  what: 'key-auth, with no consumer, on the service workshop-service: the gateway answers every workshop path 401'
  changes:
  - kind: kong_plugin_add
    service: workshop-service
    plugin:
      name: key-auth

kong-1-2-mechanic-auth-header-200:
  what: a route GET ~/workshop/api/mechanic/$ answers 200 with one fixed body to any request carrying an Authorization
    header and 401 to one without it
  changes:
  - kind: kong_entity_add
    list: routes
    item:
      name: validation-1-2-anchor
      service: workshop-service
      paths:
      - ~/workshop/api/mechanic/$
      methods:
      - GET
      strip_path: false
      protocols:
      - https
      plugins:
      - name: pre-function
        config:
          access:
          - if kong.request.get_header("authorization") then return kong.response.exit(200, {validation = "served"})
            end return kong.response.exit(401, {message = "unauthorized"})

kong-1-2-mechanic-degraded-200-other:
  what: a route GET ~/workshop/api/mechanic/$ passes its first two requests to crAPI and answers every later one
    200 with a body of another shape
  changes:
  - kind: kong_entity_add
    list: routes
    item:
      name: validation-1-2-anchor
      service: workshop-service
      paths:
      - ~/workshop/api/mechanic/$
      methods:
      - GET
      strip_path: false
      protocols:
      - https
      plugins:
      - name: pre-function
        config:
          access:
          - local n = ngx.shared.kong:incr("v12_anchor", 1, 0) if n > 2 then return kong.response.exit(200, {error
            = {code = 1, validation = "envelope"}}) end

