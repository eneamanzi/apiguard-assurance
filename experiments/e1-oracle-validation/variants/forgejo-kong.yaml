# Variants of the Forgejo + Kong lab (test-environments/forgejo-kong). Each is a temporary change to kong/kong.yml,
# applied and undone by experiments/e1-oracle-validation/run.py (Kong recreated, the file restored and checked identical).

kong-hmac-all-headers:
  what: hmac-auth of hmac-audit-dummy requires date, x-date, digest and request-line in the signature
  changes:
  - kind: kong_plugin_set
    service: hmac-audit-dummy
    plugin: hmac-auth
    set:
      enforce_headers:
      - date
      - x-date
      - digest
      - request-line

kong-hmac-digest-only:
  what: hmac-auth of hmac-audit-dummy requires date, x-date and digest, not request-line
  changes:
  - kind: kong_plugin_set
    service: hmac-audit-dummy
    plugin: hmac-auth
    set:
      enforce_headers:
      - date
      - x-date
      - digest

kong-hmac-sha1-window-600:
  what: hmac-auth of hmac-audit-dummy also allows hmac-sha1, with a 600 s clock skew
  changes:
  - kind: kong_plugin_set
    service: hmac-audit-dummy
    plugin: hmac-auth
    set:
      algorithms:
      - hmac-sha1
      - hmac-sha256
      - hmac-sha384
      - hmac-sha512
      clock_skew: 600

kong-hmac-anonymous:
  what: hmac-auth of hmac-audit-dummy lets an unsigned request through as the consumer 'anonymous-caller'
  changes:
  - kind: kong_entity_add
    list: consumers
    item:
      username: anonymous-caller
  - kind: kong_plugin_set
    service: hmac-audit-dummy
    plugin: hmac-auth
    set:
      anonymous: anonymous-caller

kong-0-1-served-routes:
  what: 'a service of its own whose routes answer without reaching Forgejo: 200 to the undeclared methods of /api/v1/version
    and /api/v1/users/<any>/heatmap, 400 to those of /api/v1/settings/api and /api/v1/users/search, 200 to /api/v2/orgs'
  changes:
  - kind: kong_entity_add
    list: services
    item:
      name: validation-0-1-served
      url: http://forgejo-upstream
      routes:
      - name: v01-version-served
        paths:
        - ~/api/v1/version$
        methods:
        - POST
        - PUT
        - PATCH
        - DELETE
        strip_path: false
        protocols:
        - https
        plugins:
        - name: request-termination
          config:
            status_code: 200
            content_type: application/json
            body: '{"validation":"served"}'
      - name: v01-heatmap-served
        paths:
        - ~/api/v1/users/[^/]+/heatmap$
        methods:
        - POST
        - PUT
        - PATCH
        - DELETE
        strip_path: false
        protocols:
        - https
        plugins:
        - name: request-termination
          config:
            status_code: 200
            content_type: application/json
            body: '{"validation":"served"}'
      - name: v01-settings-known
        paths:
        - ~/api/v1/settings/api$
        methods:
        - POST
        - PUT
        - PATCH
        - DELETE
        strip_path: false
        protocols:
        - https
        plugins:
        - name: request-termination
          config:
            status_code: 400
            content_type: application/json
            body: '{"validation":"known"}'
      - name: v01-search-known
        paths:
        - ~/api/v1/users/search$
        methods:
        - POST
        - PUT
        - PATCH
        - DELETE
        strip_path: false
        protocols:
        - https
        plugins:
        - name: request-termination
          config:
            status_code: 400
            content_type: application/json
            body: '{"validation":"known"}'
      - name: v01-version-v2
        paths:
        - ~/api/v2/orgs$
        strip_path: false
        protocols:
        - https
        plugins:
        - name: request-termination
          config:
            status_code: 200
            content_type: application/json
            body: '{"validation":"v2"}'

kong-0-1-version-not-found-other:
