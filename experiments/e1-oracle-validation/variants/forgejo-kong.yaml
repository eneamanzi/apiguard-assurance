            body: '{"validation":"any"}'

kong-0-1-unstable-unknown:
  what: a route matching the tool's random probe names (zqxv + hex) answers 404 with one of two JSON body shapes
    in turn
  changes:
  - kind: kong_entity_add
    list: services
    item:
      name: validation-0-1-unstable
      url: http://forgejo-upstream
      routes:
      - name: v01-unstable
        paths:
        - ~/.*zqxv[0-9a-f]+.*$
        strip_path: false
        protocols:
        - https
        plugins:
        - name: pre-function
          config:
            access:
            - local n = 0 return function() n = n + 1 if n % 2 == 0 then return kong.response.exit(404, {message
              = 'a'}) end return kong.response.exit(404, {error = {code = 1}}) end

kong-0-1-version-429-slow-post:
  what: /api/v1/version answers 429 to PUT, PATCH, DELETE and makes POST sleep 7 s before answering 200
  changes:
  - kind: kong_entity_add
    list: services
    item:
      name: validation-0-1-rate-slow
      url: http://forgejo-upstream
      routes:
      - name: v01-version-429
        paths:
        - ~/api/v1/version$
        methods:
        - PUT
        - PATCH
        - DELETE
        strip_path: false
        protocols:
        - https
        plugins:
        - name: request-termination
          config:
            status_code: 429
            content_type: application/json
            body: '{"validation":"slow down"}'
      - name: v01-version-slow
        paths:
        - ~/api/v1/version$
        methods:
        - POST
        strip_path: false
        protocols:
        - https
        plugins:
        - name: pre-function
          config:
            access:
            - ngx.sleep(7) return kong.response.exit(200, {validation = 'slow'})

