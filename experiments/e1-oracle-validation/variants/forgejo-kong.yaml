kong-route-zqxv-served:
  what: a prefix route /zqxv on forgejo-service whose pre-function answers 200, matching the random root probes
  changes:
  - kind: kong_entity_add
    list: routes
    item:
      name: zqxv-served
      paths:
      - /zqxv
      strip_path: false
      protocols:
      - https
      plugins:
      - name: pre-function
        config:
          access:
          - return kong.response.exit(200, {message = "served"})
      service: forgejo-service

kong-route-zqxv-unstable:
  what: a route ~/zqxv[0-9a-f]+$ whose pre-function answers 404 with one of two body shapes in turn
  changes:
  - kind: kong_entity_add
    list: routes
    item:
      name: zqxv-unstable
      paths:
      - ~/zqxv[0-9a-f]+$
      strip_path: false
      protocols:
      - https
      plugins:
      - name: pre-function
        config:
          access:
          - local n = ngx.shared.kong:incr("zqxv_flip", 1, 0) if n % 2 == 0 then return kong.response.exit(404,
            {message = "a"}) end return kong.response.exit(404, "b")
      service: forgejo-service

kong-route-zqxv-to-forgejo:
  what: a prefix route /zqxv on forgejo-service sending the root probes to Forgejo under /api/v1
  changes:
  - kind: kong_entity_add
    list: routes
    item:
