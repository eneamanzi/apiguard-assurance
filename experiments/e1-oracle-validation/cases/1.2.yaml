        outcome: ENFORCED
        detail: REFUSED
      how: 'the lab as built: crAPI refuses the token with a claim added and the original signature (401)'
      lab: crapi-kong
      variant: none

    - id: NOT_VERIFIABLE/NOT_A_REFUSAL
