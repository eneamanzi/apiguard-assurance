  algorithm_confusion:

    - id: NOT_VERIFIABLE/NEEDS_KEY_MATERIAL
      situation: 'a JWT and a working anchor: the attack needs the public key, not fetched'
      expected:
        outcome: NOT_VERIFIABLE
        detail: NEEDS_KEY_MATERIAL
      how: 'the lab as built: crAPI issues a JWT and the anchor GET /workshop/api/mechanic/ works; the attack is
        not tried'
      lab: crapi-kong
      variant: none

    - id: NOT_VERIFIABLE/NO_WORKING_ANCHOR
      situation: no working anchor
      expected:
        outcome: NOT_VERIFIABLE
        detail: NO_WORKING_ANCHOR
      how: 'the run reads a local copy of crAPI''s specification with every operation marked security: []'
      lab: crapi-kong
      variant: none
