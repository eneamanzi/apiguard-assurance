test: '1.4'
name: Credential Revocation
sub_tests:

  rejected_after_revocation:

    - id: ENFORCED/REFUSED_AFTER_REVOCATION
      situation: the revoked credential is refused (`400`, `401`, `403`) at the anchor
      expected:
        outcome: ENFORCED
        detail: REFUSED_AFTER_REVOCATION
      how: 'the lab as built: a token is created, accepted at the anchor GET /api/v1/user, deleted (204), and refused
        401 when reused'
      lab: forgejo-kong
      variant: none

    - id: VIOLATION/ACCEPTED_AFTER_REVOCATION/CERTAIN
      situation: it is served (`2xx`) with the answer it got before revocation
      expected:
        outcome: VIOLATION
        detail: ACCEPTED_AFTER_REVOCATION
        confidence: CERTAIN
      how: 'a temporary route GET ~/api/v1/user$ answers 200 {login: user-a} to any request with an Authorization
        header and 401 without: the deleted token gets the answer it got before revocation'
      lab: forgejo-kong
      variant: kong-1-4-stale-token

    - id: VIOLATION/ACCEPTED_AFTER_REVOCATION/FIRM
      situation: it is served with another answer (a `200` may carry an error)
      expected:
        outcome: VIOLATION
        detail: ACCEPTED_AFTER_REVOCATION
        confidence: FIRM
      how: a temporary route GET ~/api/v1/user$ passes the two anchor reads (with and without the credential) to
        Forgejo and answers the reuse of the deleted token 200 with a JSON body of another shape
      lab: forgejo-kong
      variant: kong-1-4-revoked-200-other

    - id: NOT_VERIFIABLE/NOT_A_REFUSAL
      situation: it gets another answer (a redirect, `404`, ...)
      expected:
        outcome: NOT_VERIFIABLE
        detail: NOT_A_REFUSAL
      how: the same counter route answering the reuse of the deleted token 404
      lab: forgejo-kong
      variant: kong-1-4-revoked-404

    - id: NOT_VERIFIABLE/NO_WORKING_ANCHOR
      situation: no documented read accepts the new credential and refuses no credential
      expected:
        outcome: NOT_VERIFIABLE
        detail: NO_WORKING_ANCHOR
      how: the run reads a local copy of Forgejo's specification with its global security set to [], so no documented
        read requires authentication and none is a candidate anchor
      lab: forgejo-kong
      variant: none
      spec:
        set:
          security: []
        add_operations: []
        drop_plain_get: false
        drop_operations: []

    - id: NOT_VERIFIABLE/REVOCATION_NOT_CONFIRMED
      situation: the delete request of the credential did not answer `2xx`
      expected:
        outcome: NOT_VERIFIABLE
        detail: REVOCATION_NOT_CONFIRMED
      how: a temporary route DELETE ~/api/v1/users/[^/]+/tokens/[^/]+$ answers the first token deletion (the test's
        revocation) 404 itself; the teardown deletions pass to Forgejo, so no token is left behind
      lab: forgejo-kong
      variant: kong-1-4-first-delete-404

  any_sub_test:

    - id: NOT_VERIFIABLE/UPSTREAM_UNAVAILABLE
      situation: 'an answer of this category on any sub-test that does not judge it: 502, 503, 504: the gateway
        could not reach the backend, or the backend did not answer in time. It says nothing about the guarantee
        (one rule for every test)'
      expected:
        outcome: NOT_VERIFIABLE
        detail: UPSTREAM_UNAVAILABLE
      how: a temporary route GET ~/api/v1/user$ passes the two anchor reads to Forgejo and answers the reuse of
        the deleted token 503
      lab: forgejo-kong
      variant: kong-1-4-revoked-503

    - id: NOT_VERIFIABLE/RATE_LIMITED
      situation: 'an answer of this category on any sub-test that does not judge it: 429: refused for the rate of
        the requests. It says nothing about the guarantee (one rule for every test)'
      expected:
        outcome: NOT_VERIFIABLE
        detail: RATE_LIMITED
      how: the same counter route answering the reuse 429
      lab: forgejo-kong
      variant: kong-1-4-revoked-429

    - id: NOT_VERIFIABLE/SERVER_ERROR
      situation: 'an answer of this category on any sub-test that does not judge it: 500, 505-508, 510: the application
        failed. It says nothing about the guarantee (one rule for every test)'
      expected:
        outcome: NOT_VERIFIABLE
        detail: SERVER_ERROR
      how: the same counter route answering the reuse 500
      lab: forgejo-kong
      variant: kong-1-4-revoked-500

    - id: NOT_VERIFIABLE/NO_RESPONSE
      situation: 'an answer of this category on any sub-test that does not judge it: No HTTP response: timeout,
        connection refused, TLS error, connection reset. It says nothing about the guarantee (one rule for every
        test)'
      expected:
        outcome: NOT_VERIFIABLE
        detail: NO_RESPONSE
      how: the same counter route sleeping 7 s on the reuse before proxying, with the run's read timeout at 5 s
      lab: forgejo-kong
      variant: kong-1-4-revoked-slow
      config:
        target.read_timeout: 5.0
