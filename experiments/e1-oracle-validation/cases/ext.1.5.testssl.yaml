test: ext.1.5.testssl
name: TLS Stack Analysis (testssl.sh)
sub_tests:

  tls_configuration:

    - id: VIOLATION/DEPRECATED_PROTOCOL/CERTAIN
      situation: testssl.sh finds SSLv2, SSLv3, TLS 1.0 or TLS 1.1 offered (a handshake succeeded)
      expected:
        outcome: VIOLATION
        detail: DEPRECATED_PROTOCOL
        confidence: CERTAIN
      how: 'Kong recreated with KONG_SSL_PROTOCOLS=TLSv1 TLSv1.1 TLSv1.2 TLSv1.3 and KONG_SSL_CIPHER_SUITE=old:
        testssl.sh finds TLS1 and TLS1_1 offered'
      lab: forgejo-kong
      variant: kong-ext-1-5-old-tls

    - id: VIOLATION/TLS_WEAKNESS/FIRM
      situation: testssl.sh rates a finding HIGH or CRITICAL (not about revocation)
      expected:
        outcome: VIOLATION
        detail: TLS_WEAKNESS
        confidence: FIRM
      how: 'target.tls set to verify: false with no ca_bundle, so testssl.sh runs without --add-ca and rates the
        private chain cert_chain_of_trust CRITICAL'
      lab: forgejo-kong
      variant: none
      config:
        target.tls:
          verify: false

    - id: NOT_VERIFIABLE/CERT_REVOCATION_NOT_CHECKABLE
      situation: a HIGH or CRITICAL finding about revocation (no OCSP or CRL)
      expected:
        outcome: NOT_VERIFIABLE
        detail: CERT_REVOCATION_NOT_CHECKABLE
      how: 'the lab as built: the labs'' private CA offers no OCSP or CRL, which testssl.sh rates HIGH'
      lab: forgejo-kong
      variant: none

    - id: NOT_VERIFIABLE/SCAN_INCOMPLETE
      situation: no weakness, and a FATAL entry says the scan did not finish
      expected:
        outcome: NOT_VERIFIABLE
        detail: SCAN_INCOMPLETE
      how: ''
      lab: ''
      variant: ''
      not_producible:
        group: environment
        reason: In testssl.sh 3.x a FATAL entry without exiting comes only from ip_fatal (a host name that resolves
          to several addresses, one of which refuses the connection); every other FATAL exits with 242 or above,
          which the connector turns into ERROR. The labs' base URL is localhost, which resolves to 127.0.0.1 only,
          and any other name fails the certificate's names (localhost, 127.0.0.1, kong, apisix), which testssl.sh
          rates as a weakness

    - id: ENFORCED/NO_TLS_WEAKNESS
      situation: no weakness and no deprecated protocol in a finished scan
      expected:
        outcome: ENFORCED
        detail: NO_TLS_WEAKNESS
      how: 'the lab as built: only TLS 1.2/1.3 with ECDHE + AES-GCM, no HIGH or CRITICAL finding other than revocation'
      lab: forgejo-kong
      variant: none
