test: '0.3'
name: Deprecated Operations Still Served
sub_tests:

  deprecated_operations:

    - id: ENFORCED/SWITCHED_OFF
      situation: '`410 Gone`'
      expected:
        outcome: ENFORCED
        detail: SWITCHED_OFF
      how: a temporary Kong route on the deprecated read as the test fills it (times/user-a) answers 410 itself
      lab: forgejo-kong
      variant: kong-0-3-gone

    - id: ENFORCED/METHOD_SWITCHED_OFF
      situation: '`405` or `501`: the method is no longer available on the path'
      expected:
        outcome: ENFORCED
        detail: METHOD_SWITCHED_OFF
      how: a temporary Kong route on the deprecated read (times/user-a) answers 405 itself
      lab: forgejo-kong
      variant: kong-0-3-method-not-allowed

    - id: VIOLATION/DEPRECATED_WITHOUT_SUNSET/FIRM
      situation: served or validated (`2xx`, `4xx` invalid) unlike a random sibling, with neither `Deprecation`
        nor `Sunset`
      expected:
        outcome: VIOLATION
        detail: DEPRECATED_WITHOUT_SUNSET
        confidence: FIRM
      how: 'the lab as built: GET /api/v1/repos/{owner}/{repo}/times/{user}, filled from path_seed, answers 200
        unlike a random sibling, with neither Deprecation nor Sunset'
      lab: forgejo-kong
      variant: none

    - id: VIOLATION/DEPRECATION_WITHOUT_SUNSET/FIRM
      situation: served unlike a random sibling, with `Deprecation` and no `Sunset`
      expected:
        outcome: VIOLATION
        detail: DEPRECATION_WITHOUT_SUNSET
        confidence: FIRM
      how: 'a temporary Kong route on the deprecated read (times/user-a) adds ''Deprecation: @1688169599'' to Forgejo''s
        answer'
      lab: forgejo-kong
      variant: kong-0-3-deprecation-only

    - id: VIOLATION/PAST_SUNSET_STILL_SERVED/FIRM
      situation: served unlike a random sibling, with a `Sunset` date that has passed
      expected:
        outcome: VIOLATION
        detail: PAST_SUNSET_STILL_SERVED
        confidence: FIRM
      how: 'a temporary Kong route on the deprecated read (times/user-a) adds ''Sunset: Wed, 01 Jan 2020 00:00:00
        GMT'' to Forgejo''s answer'
      lab: forgejo-kong
      variant: kong-0-3-sunset-past

    - id: ENFORCED/SUNSET_DECLARED
      situation: served unlike a random sibling, with a `Sunset` date in the future
      expected:
        outcome: ENFORCED
        detail: SUNSET_DECLARED
      how: 'a temporary Kong route on the deprecated read (times/user-a) adds ''Sunset: Sat, 31 Dec 2099 23:59:59
        GMT'' to Forgejo''s answer'
      lab: forgejo-kong
      variant: kong-0-3-sunset-future

    - id: NOT_VERIFIABLE/SUNSET_NOT_A_DATE
      situation: served unlike a random sibling, with a `Sunset` that is not an HTTP-date
      expected:
        outcome: NOT_VERIFIABLE
        detail: SUNSET_NOT_A_DATE
      how: 'a temporary Kong route on the deprecated read (times/user-a) adds ''Sunset: soon'' to Forgejo''s answer'
      lab: forgejo-kong
      variant: kong-0-3-sunset-not-a-date

    - id: NOT_APPLICABLE/NOT_SERVED
      situation: 'a path without parameters answers like a random sibling: the operation is gone'
      expected:
        outcome: NOT_APPLICABLE
        detail: NOT_SERVED
      how: 'the run reads a local copy of Forgejo''s specification with one added operation without path parameters,
        GET /api/v1/apiguard-deprecated-probe marked deprecated, that Forgejo does not serve: it answers 404 like
        its random sibling'
      lab: forgejo-kong
      variant: none
      spec:
        set: {}
        add_operations:
          - path: /apiguard-deprecated-probe
            method: get
            operation:
              deprecated: true
              summary: validation probe
              responses:
                '200':
                  description: OK
        drop_plain_get: false
        drop_operations: []

    - id: NOT_VERIFIABLE/OBJECT_OR_OPERATION_ABSENT
      situation: 'a path with parameters answers like a random object: the operation gone, or the seeded object
        not found'
      expected:
        outcome: NOT_VERIFIABLE
        detail: OBJECT_OR_OPERATION_ABSENT
      how: a temporary Kong route on times/<any> (the deprecated read and its random siblings) answers the same
        fixed 404 itself
      lab: forgejo-kong
      variant: kong-0-3-times-404-alike

    - id: NOT_VERIFIABLE/REFUSED_BEFORE_ANSWER
      situation: refused (`401`, `403`) without a credential and with user_a's, or without and no user_a account
      expected:
        outcome: NOT_VERIFIABLE
        detail: REFUSED_BEFORE_ANSWER
      how: a temporary Kong route on the deprecated read (times/user-a) answers 401 itself, with or without user_a's
        credential
      lab: forgejo-kong
      variant: kong-0-3-unauthorized

    - id: NOT_VERIFIABLE/ANSWER_NOT_INTERPRETED
      situation: a redirect, a `404` unlike a random sibling, or an answer of no class
      expected:
        outcome: NOT_VERIFIABLE
        detail: ANSWER_NOT_INTERPRETED
      how: a temporary Kong route on the deprecated read (times/user-a) answers 302 to https://localhost:8443/ itself
      lab: forgejo-kong
      variant: kong-0-3-redirect

    - id: NOT_VERIFIABLE/CALIBRATION_UNRELIABLE
      situation: the calibration of the operation's siblings is unreliable
      expected:
        outcome: NOT_VERIFIABLE
        detail: CALIBRATION_UNRELIABLE
      how: a temporary Kong route on times/<any> (the deprecated read and its random siblings) answers 404 with
        a body of one of two shapes, alternating, so the two calibration siblings differ
      lab: forgejo-kong
      variant: kong-0-3-times-404-random-shape

    - id: NOT_VERIFIABLE/WRITE_METHOD_NOT_PROBED
      situation: 'the operation''s method writes: not sent'
      expected:
        outcome: NOT_VERIFIABLE
        detail: WRITE_METHOD_NOT_PROBED
      how: 'the lab as built: three deprecated operations write (POST /org/{org}/repos, DELETE and PATCH .../comments/{id})
        and are not sent'
      lab: forgejo-kong
      variant: none

    - id: NOT_VERIFIABLE/PATH_NOT_FILLABLE
      situation: a path parameter has no value in `path_seed`
      expected:
        outcome: NOT_VERIFIABLE
        detail: PATH_NOT_FILLABLE
      how: the run's target.path_seed is emptied, so the deprecated read's path parameters have no value
      lab: forgejo-kong
      variant: none
      config:
        target.path_seed: {}

  any_sub_test:

    - id: NOT_VERIFIABLE/UPSTREAM_UNAVAILABLE
      situation: 'an answer of this category on any sub-test that does not judge it: 502, 503, 504: the gateway
        could not reach the backend, or the backend did not answer in time. It says nothing about the guarantee
        (one rule for every test)'
      expected:
        outcome: NOT_VERIFIABLE
        detail: UPSTREAM_UNAVAILABLE
      how: a temporary Kong route on the deprecated read (times/user-a) answers 503 itself
      lab: forgejo-kong
      variant: kong-0-3-answer-503

    - id: NOT_VERIFIABLE/RATE_LIMITED
      situation: 'an answer of this category on any sub-test that does not judge it: 429: refused for the rate of
        the requests. It says nothing about the guarantee (one rule for every test)'
      expected:
        outcome: NOT_VERIFIABLE
        detail: RATE_LIMITED
      how: a temporary Kong route on the deprecated read (times/user-a) answers 429 itself
      lab: forgejo-kong
      variant: kong-0-3-answer-429

    - id: NOT_VERIFIABLE/SERVER_ERROR
      situation: 'an answer of this category on any sub-test that does not judge it: 500, 505-508, 510: the application
        failed. It says nothing about the guarantee (one rule for every test)'
      expected:
        outcome: NOT_VERIFIABLE
        detail: SERVER_ERROR
      how: a temporary Kong route on the deprecated read (times/user-a) answers 500 itself
      lab: forgejo-kong
      variant: kong-0-3-answer-500

    - id: NOT_VERIFIABLE/NO_RESPONSE
      situation: 'an answer of this category on any sub-test that does not judge it: No HTTP response: timeout,
        connection refused, TLS error, connection reset. It says nothing about the guarantee (one rule for every
        test)'
      expected:
        outcome: NOT_VERIFIABLE
        detail: NO_RESPONSE
      how: a temporary Kong route on the deprecated read (times/user-a) sleeps 7 s before proxying, and the run's
        read timeout is 5 s
      lab: forgejo-kong
      variant: kong-0-3-slow
      config:
        target.read_timeout: 5.0
