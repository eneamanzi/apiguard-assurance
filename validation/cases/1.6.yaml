        add_operations: []
        drop_plain_get: false

    - id: VIOLATION/COOKIE_WITHOUT_SECURE/FIRM
      situation: 'another cookie the login sets (whether it carries the session is not proven: it may be a load
        balancer''s) lacks `Secure`'
      expected:
        outcome: VIOLATION
        detail: COOKIE_WITHOUT_SECURE
        confidence: FIRM
      how: 'the same run as COOKIE_SAFE: the second cookie AWSALB, not the one the credential is read from, lacks
        Secure'
      lab: forgejo-kong
      variant: kong-1-6-cookie-login
