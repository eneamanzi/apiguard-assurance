          securityDefinitions: {}
          security: []
        add_operations: []
        drop_plain_get: false

    - id: VIOLATION/COOKIE_WITHOUT_PREFIX/CERTAIN
      situation: the cookie the configuration reads the credential from (`cookie:<name>`) lacks a `__Host-` or `__Secure-`
        name prefix
      expected:
        outcome: VIOLATION
        detail: COOKIE_WITHOUT_PREFIX
        confidence: CERTAIN
      how: 'the same run as COOKIE_WITHOUT_SECURE/CERTAIN: the session cookie is named sid, without __Host- or __Secure-'
      lab: forgejo-kong
