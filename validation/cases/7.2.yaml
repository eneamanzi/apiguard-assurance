test: '7.2'
name: Server-Side Request Forgery Prevention
sub_tests:

  cloud_metadata:

    - id: ENFORCED/SSRF_BLOCKED_SCHEME
      situation: the payload is refused as invalid or forbidden (`400`, `403`, `422`, ...), the benign URL accepted
        before and after the series, and unlike the unreachable URL
      expected:
        outcome: ENFORCED
        detail: SSRF_BLOCKED_SCHEME
      how: a route on the webhook creation answers the payloads 400 "unsupported scheme", a scheme keyword of the
        body, while the controls reach Forgejo
      lab: forgejo-kong
      variant: kong-7-2-hooks-400-scheme

    - id: ENFORCED/SSRF_BLOCKED_MALFORMED
      situation: the payload is refused as invalid or forbidden (`400`, `403`, `422`, ...), the benign URL accepted
        before and after the series, and unlike the unreachable URL
      expected:
        outcome: ENFORCED
        detail: SSRF_BLOCKED_MALFORMED
      how: a route on the webhook creation answers the payloads 400 "invalid url", a malformed keyword of the body,
        while the controls reach Forgejo
      lab: forgejo-kong
      variant: kong-7-2-hooks-400-malformed

    - id: ENFORCED/SSRF_BLOCKED_VALIDATION
      situation: the payload is refused as invalid or forbidden (`400`, `403`, `422`, ...), the benign URL accepted
        before and after the series, and unlike the unreachable URL
      expected:
        outcome: ENFORCED
        detail: SSRF_BLOCKED_VALIDATION
      how: a route on the webhook creation answers the payloads 422 "host not allowed" while the benign and the
        unreachable controls reach Forgejo
      lab: forgejo-kong
      variant: kong-7-2-hooks-422-host-not-allowed

    - id: ENFORCED/SSRF_BLOCKED_UNKNOWN
      situation: the payload is refused as invalid or forbidden (`400`, `403`, `422`, ...), the benign URL accepted
        before and after the series, and unlike the unreachable URL
      expected:
        outcome: ENFORCED
        detail: SSRF_BLOCKED_UNKNOWN
      how: a route on the webhook creation answers the payloads 400 "nope" while the controls reach Forgejo
      lab: forgejo-kong
      variant: kong-7-2-hooks-400-nope

    - id: NOT_VERIFIABLE/REJECTED_LIKE_UNREACHABLE
      situation: 'refused exactly as the unreachable URL is: a failed fetch, not a block'
      expected:
        outcome: NOT_VERIFIABLE
        detail: REJECTED_LIKE_UNREACHABLE
      how: 'a route on the webhook creation answers the unreachable control and every payload with the same 400
        {message: could not connect}, the benign control reaching Forgejo'
      lab: forgejo-kong
      variant: kong-7-2-hooks-like-unreachable

    - id: NOT_VERIFIABLE/BASELINE_REJECTED
      situation: refused while the benign URL is refused too, before or after the series
      expected:
        outcome: NOT_VERIFIABLE
        detail: BASELINE_REJECTED
      how: a route on the webhook creation answers every request 422, the benign control included
      lab: forgejo-kong
      variant: kong-7-2-hooks-422-all

    - id: VIOLATION/SSRF_CONTENT_REFLECTED/CERTAIN
      situation: accepted (`2xx`) with a cloud-metadata marker in the answer, the endpoint reflecting what it fetches
      expected:
        outcome: VIOLATION
        detail: SSRF_CONTENT_REFLECTED
        confidence: CERTAIN
      how: a route on the webhook creation returns example.com's page for the benign control, a 400 for the unreachable
        one and a cloud-metadata listing (ami-id) with 200 for every payload
      lab: forgejo-kong
      variant: kong-7-2-hooks-reflect-metadata

    - id: NOT_VERIFIABLE/OUTBOUND_NOT_CONFIRMED
      situation: 'accepted (`2xx`): the outbound call is not observable'
      expected:
        outcome: NOT_VERIFIABLE
        detail: OUTBOUND_NOT_CONFIRMED
      how: 'the lab as built: Forgejo creates the inactive webhook for the payload URL (201), validating it only
        when the webhook fires'
      lab: forgejo-kong
      variant: none

    - id: NOT_VERIFIABLE/CREDENTIAL_REFUSED
      situation: '`401`: the credential refused'
      expected:
        outcome: NOT_VERIFIABLE
        detail: CREDENTIAL_REFUSED
      how: a route on the webhook creation answers every payload 401 while the controls reach Forgejo
      lab: forgejo-kong
      variant: kong-7-2-hooks-401

    - id: NOT_VERIFIABLE/REDIRECTED
      situation: a redirect, not followed
      expected:
        outcome: NOT_VERIFIABLE
        detail: REDIRECTED
      how: a route on the webhook creation answers every payload 302 to http://example.com/ while the controls reach
        Forgejo
      lab: forgejo-kong
      variant: kong-7-2-hooks-302

    - id: NOT_VERIFIABLE/NOT_FOUND
      situation: '`404`, perhaps the fetched page''s own'
      expected:
        outcome: NOT_VERIFIABLE
        detail: NOT_FOUND
      how: a route on the webhook creation answers every payload 404 while the controls reach Forgejo
      lab: forgejo-kong
      variant: kong-7-2-hooks-404

    - id: NOT_VERIFIABLE/ANSWER_NOT_INTERPRETED
      situation: another answer (`405`, `408`, a status of no class, a `5xx` outside the shared rule)
      expected:
        outcome: NOT_VERIFIABLE
        detail: ANSWER_NOT_INTERPRETED
      how: a route on the webhook creation answers every payload 418 (a status of no class) while the controls reach
        Forgejo
      lab: forgejo-kong
      variant: kong-7-2-hooks-418

    - id: NOT_VERIFIABLE/SSRF_PROBE_TIMEOUT
      situation: 'no answer: the server may still be fetching the URL'
      expected:
        outcome: NOT_VERIFIABLE
        detail: SSRF_PROBE_TIMEOUT
      how: a route on the webhook creation answers every payload after 7 s, the run's read timeout 5 s and only
        cloud_metadata enabled, so its first payload gets no answer
      lab: forgejo-kong
      variant: kong-7-2-hooks-slow
      config:
        target.read_timeout: 5.0
        tests.domain_7.test_7_2.payload_categories:
          - cloud_metadata

    - id: NOT_VERIFIABLE/NOT_SENT_AFTER_TIMEOUT
      situation: 'not sent: an earlier payload got no answer or the gateway''s `502`, `503`, `504`'
      expected:
        outcome: NOT_VERIFIABLE
        detail: NOT_SENT_AFTER_TIMEOUT
      how: 'the lab as built: contact_mechanic hangs on the first non-loopback private_ip URL (10.0.0.1), Kong answers
        504, and every later payload is not sent'
      lab: crapi-kong
      variant: none

    - id: NOT_VERIFIABLE/OBJECT_NOT_CREATED
      situation: the prepared resource could not be created
      expected:
        outcome: NOT_VERIFIABLE
        detail: OBJECT_NOT_CREATED
      how: the repository resource's create path points at a path Forgejo answers 404, so the prepared resource
        is not created
      lab: forgejo-kong
      variant: none
      config:
        resources.repository.create.path: /api/v1/user/repos-validation-missing

