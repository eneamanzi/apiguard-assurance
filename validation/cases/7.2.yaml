        detail: SSRF_BLOCKED_MALFORMED
      how: ''
      lab: ''
      variant: ''
      not_producible:
        group: code
        reason: 'every forbidden_protocol payload has a non-HTTP scheme (file, gopher, dict, ftp, ldap, tftp, sftp,
          netdoc), and _classify_rejection returns SSRF_BLOCKED_SCHEME for such a scheme before reading the body:
          a rejected forbidden_protocol payload is never MALFORMED'

