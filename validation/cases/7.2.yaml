        detail: SSRF_BLOCKED_SCHEME
      how: 'the lab as built: Forgejo rejects every non-HTTP scheme URL (file, gopher, dict, ...) at webhook creation,
        while it accepts the benign URL before and after the series'
      lab: forgejo-kong
      variant: none

