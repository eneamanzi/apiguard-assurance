# docker-compose.yml - Forgejo + Kong lab environment
#
# Ports published on the host:
#   8000  Kong proxy, HTTP   (answers 301 to HTTPS on the API route: test 1.5)
#   8443  Kong proxy, HTTPS  (the tool's target and the specification, /swagger.v1.json)
#   8001  Kong Admin API, HTTP   (127.0.0.1 only; kept for the maintainer commands)
#   8444  Kong Admin API, HTTPS  (127.0.0.1 only; the tool's gateway.admin.url)
# Forgejo publishes no port: it is reachable only through Kong and, on the lab
# network, by forgejo-setup (http://forgejo:3000).
#
# Credentials and secrets are not written here: they are read from the .env file
# in the repository root, shared with the tool. Run every command from this
# folder with:
#   docker compose --env-file ../../.env <command>
# Create .env once with: cp .env.example .env (from the repository root).
#
# Versions: every image is pinned to an exact version, so that the lab (and the
# results of an assessment on it) does not change when a new image is published.
# The pinned versions are listed in docs/03-reference/06-compatibility.md ("Test lab");
# update both places together, then verify the lab from scratch.
#
# TLS: the one-shot service "pki" runs ../pki/gen-pki.sh before Kong starts: it
# creates the labs' authority and the certificates it signs in ../pki (never
# committed), and does nothing when they exist and are valid. Kong serves
# ../pki/server.crt on the proxy and on the HTTPS Admin API; the tool trusts
# ../pki/ca.crt (config.yaml, tls.ca_bundle).

networks:
  lab-net:
    driver: bridge

volumes:
  forgejo-data:
  forgejo-db-data:

services:

  # The labs' certificate authority and certificates (../pki/gen-pki.sh), with
  # the openssl of the Kong image; root inside the container to write the shared
  # folder, the files are given back to the folder's owner.
  pki:
    image: kong:3.9.3
    container_name: forgejo_kong_pki
    user: "0"
    entrypoint: ["sh", "/pki/gen-pki.sh"]
    volumes:
      - ../pki:/pki

  # PostgreSQL 15: backend di persistenza per Forgejo.
  # Versione Alpine per footprint ridotto in ambiente di laboratorio.
  forgejo-db:
    image: postgres:15.19-alpine
    container_name: forgejo-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=forgejo
      - POSTGRES_PASSWORD=${LAB_DB_PASSWORD:?LAB_DB_PASSWORD is not set - create .env in the repository root (cp .env.example .env) and run docker compose with --env-file ../../.env}
      - POSTGRES_DB=forgejo
    volumes:
      - forgejo-db-data:/var/lib/postgresql/data
    networks:
      - lab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Forgejo 14: API REST target dell'assessment.
  # INSTALL_LOCK=true bypassa il wizard di primo avvio.
  # ENABLE_SWAGGER=true espone /api/swagger per OpenAPI discovery.
  forgejo:
    image: codeberg.org/forgejo/forgejo:14.0.5
    container_name: forgejo
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=forgejo-db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=${LAB_DB_PASSWORD:?LAB_DB_PASSWORD is not set - create .env in the repository root (cp .env.example .env) and run docker compose with --env-file ../../.env}
      - FORGEJO__server__HTTP_PORT=3000
      # The public address (Kong): links in Forgejo's answers point to it.
      - FORGEJO__server__ROOT_URL=https://localhost:8443/
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__security__SECRET_KEY=${LAB_FORGEJO_SECRET_KEY:?LAB_FORGEJO_SECRET_KEY is not set - create .env in the repository root (cp .env.example .env) and run docker compose with --env-file ../../.env}
      - FORGEJO__api__ENABLE_SWAGGER=true
      - FORGEJO__log__LEVEL=Info
    volumes:
      - forgejo-data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - lab-net
    depends_on:
      forgejo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Kong 3.9, DB-less: the declarative configuration is ./kong/kong.yml.
  # Proxy: HTTP on 8000, HTTPS on 8443. Admin API (white-box tests): HTTP on
  # 8001 and HTTPS on 8444 (Kong's default pair), published on 127.0.0.1 only.
  # Proxy and Admin API serve the lab certificate (../pki/server.crt).
  kong:
    image: kong:3.9.3
    container_name: kong
    restart: unless-stopped
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/kong/kong.yml
      - KONG_PROXY_LISTEN=0.0.0.0:8000, 0.0.0.0:8443 ssl
      - KONG_SSL_CERT=/etc/kong/pki/server.crt
      - KONG_SSL_CERT_KEY=/etc/kong/pki/server.key
      - KONG_ADMIN_LISTEN=0.0.0.0:8001, 0.0.0.0:8444 ssl
      - KONG_ADMIN_SSL_CERT=/etc/kong/pki/server.crt
      - KONG_ADMIN_SSL_CERT_KEY=/etc/kong/pki/server.key
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_HEADERS=off      # no "Server: kong/version" header (test 6.2)
    volumes:
      - ./kong:/kong:ro
      - ../pki:/etc/kong/pki:ro
    ports:
      - "8000:8000"              # HTTP proxy
      - "8443:8443"              # HTTPS proxy (the tool's target)
      - "127.0.0.1:8001:8001"    # Admin API, HTTP
      - "127.0.0.1:8444:8444"    # Admin API, HTTPS (the tool's gateway.admin.url)
    networks:
      - lab-net
    depends_on:
      pki:
        condition: service_completed_successfully
      forgejo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  forgejo-setup:
    image: codeberg.org/forgejo/forgejo:14.0.5
    container_name: forgejo_setup
    depends_on:
      forgejo:
        condition: service_healthy
    volumes:
      - forgejo-data:/data
    networks:
      - lab-net
    environment:
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=forgejo-db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=${LAB_DB_PASSWORD:?LAB_DB_PASSWORD is not set - create .env in the repository root (cp .env.example .env) and run docker compose with --env-file ../../.env}
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        # Users: usernames and passwords come from .env.
        # --must-change-password=false: the API accepts the credentials immediately
        # (otherwise every call returns 403 "You must change your password").
        su git -c "forgejo admin user create --admin --username ${ADMIN_USERNAME:?missing in .env} --password ${ADMIN_PASSWORD:?missing in .env} --email admin@tesi.local --must-change-password=false" || true
        su git -c "forgejo admin user create --username ${USER_A_USERNAME:?missing in .env} --password ${USER_A_PASSWORD:?missing in .env} --email usera@tesi.local --must-change-password=false" || true
        su git -c "forgejo admin user create --username ${USER_B_USERNAME:?missing in .env} --password ${USER_B_PASSWORD:?missing in .env} --email userb@tesi.local --must-change-password=false" || true

        # Test repository owned by user A. config.yaml (target.path_seed) points the
        # tool at it, so that parametric paths such as /repos/{owner}/{repo} reach a
        # real resource. HTTP 201 = created, 409 = already exists (setup run again).
        code=$$(curl -s -o /dev/null -w '%{http_code}' \
          -u "${USER_A_USERNAME}:${USER_A_PASSWORD}" -H 'Content-Type: application/json' \
          -d '{"name":"${LAB_TEST_REPO:?missing in .env}","auto_init":true}' \
          http://forgejo:3000/api/v1/user/repos)
        case "$$code" in
          201) echo "Repository ${USER_A_USERNAME}/${LAB_TEST_REPO} created." ;;
          409) echo "Repository ${USER_A_USERNAME}/${LAB_TEST_REPO} already exists." ;;
          *)   echo "Repository creation failed: HTTP $$code"; exit 1 ;;
        esac

        # Other resources named in config.yaml (target.path_seed), all owned by user A,
        # so that test 1.1 probes reach the authentication check instead of a 404.
        auth="${USER_A_USERNAME}:${USER_A_PASSWORD}"
        repo_api="http://forgejo:3000/api/v1/repos/${USER_A_USERNAME}/${LAB_TEST_REPO}"

        # Organization (Forgejo also creates its "Owners" team, id 1 on a fresh lab).
        # HTTP 201 = created, 422 = already exists.
        code=$$(curl -s -o /dev/null -w '%{http_code}' -u "$$auth" -H 'Content-Type: application/json' \
          -d '{"username":"${LAB_TEST_ORG:?missing in .env}"}' \
          http://forgejo:3000/api/v1/orgs)
        case "$$code" in
          201) echo "Organization ${LAB_TEST_ORG} created." ;;
          422) echo "Organization ${LAB_TEST_ORG} already exists." ;;
          *)   echo "Organization creation failed: HTTP $$code"; exit 1 ;;
        esac

        # Tag on the default branch. HTTP 201 = created, 409 = already exists.
        code=$$(curl -s -o /dev/null -w '%{http_code}' -u "$$auth" -H 'Content-Type: application/json' \
          -d '{"tag_name":"${LAB_TEST_TAG:?missing in .env}","target":"main"}' \
          "$$repo_api/tags")
        case "$$code" in
          201) echo "Tag ${LAB_TEST_TAG} created." ;;
          409) echo "Tag ${LAB_TEST_TAG} already exists." ;;
          *)   echo "Tag creation failed: HTTP $$code"; exit 1 ;;
        esac

        # Issue 1 and comment 1, created only if missing. Forgejo never reuses issue
        # numbers or comment ids: if they were deleted (for example by a successful
        # unauthenticated DELETE during a test), recreating them gives new numbers that
        # path_seed does not point to. In that case stop and ask for a full reset.
        reset_hint="reset the lab from scratch: docker compose --env-file ../../.env down -v, then start it again"
        if [ "$$(curl -s -o /dev/null -w '%{http_code}' -u "$$auth" "$$repo_api/issues/1")" = 200 ]; then
          echo "Issue 1 already exists."
        else
          resp=$$(curl -s -w '\n%{http_code}' -u "$$auth" -H 'Content-Type: application/json' \
            -d '{"title":"APIGuard lab issue"}' "$$repo_api/issues")
          code=$$(echo "$$resp" | tail -n 1)
          [ "$$code" = 201 ] || { echo "Issue creation failed: HTTP $$code"; exit 1; }
          number=$$(echo "$$resp" | grep -o '"number":[0-9]*' | head -n 1 | cut -d: -f2)
          [ "$$number" = 1 ] || { echo "Issue 1 was deleted earlier: Forgejo created issue $$number instead; $$reset_hint"; exit 1; }
          echo "Issue 1 created."
        fi
        if [ "$$(curl -s -o /dev/null -w '%{http_code}' -u "$$auth" "$$repo_api/issues/comments/1")" = 200 ]; then
          echo "Comment 1 already exists."
        else
          resp=$$(curl -s -w '\n%{http_code}' -u "$$auth" -H 'Content-Type: application/json' \
            -d '{"body":"APIGuard lab comment"}' "$$repo_api/issues/1/comments")
          code=$$(echo "$$resp" | tail -n 1)
          [ "$$code" = 201 ] || { echo "Comment creation failed: HTTP $$code; $$reset_hint"; exit 1; }
          comment_id=$$(echo "$$resp" | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2)
          [ "$$comment_id" = 1 ] || { echo "Comment 1 was deleted earlier: Forgejo created comment $$comment_id instead; $$reset_hint"; exit 1; }
          echo "Comment 1 created."
        fi

        echo "Provisioning completed."
