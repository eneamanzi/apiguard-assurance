_format_version: "3.0"

upstreams:
  - name: forgejo-upstream
    targets:
      - target: forgejo:3000
        weight: 100
    healthchecks:
      # Active checks only probe a target that is already unhealthy (healthy.interval: 0), every 5 s, and
      # re-enable it after one successful probe: passive checks alone never re-enable a target (Q-66,
      # https://developer.konghq.com/gateway/traffic-control/health-checks-circuit-breakers/).
      active:
        type: http
        http_path: /api/healthz
        healthy:
          interval: 0
          successes: 1
        unhealthy:
          interval: 5
      passive:
        type: http
        healthy:
          successes: 2
        unhealthy:
          http_failures: 5
          timeouts: 3
          http_statuses:
            - 500
            - 502
            - 503
            - 504

services:
  - name: forgejo-service
    # url points at the upstream, not directly at forgejo:3000, so the upstream's
    # health checks and timeouts apply (test 4.3 reads them).
    url: http://forgejo-upstream
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: forgejo-api-route
        paths:
          - /api
        strip_path: false
        preserve_host: false
        # HTTPS only; an HTTP request gets a 301 to the same path over HTTPS (test 1.5), and a path
        # that no route matches gets Kong's 404 on both listeners (test 0.2). Kong's documented
        # redirect: https://developer.konghq.com/support/how-configure-kong-to-redirect-http-traffic-to-https/
        protocols:
          - https
        https_redirect_status_code: 301
      # Forgejo's OpenAPI specification, the only path outside /api (the tool downloads it from here:
      # Forgejo publishes no port). Exact match: a Kong path starting with "~" is a regular expression
      # (https://developer.konghq.com/gateway/routing/traditional/, example "~/foo/bar$").
      - name: forgejo-spec-route
        paths:
          - '~/swagger\.v1\.json$'
        strip_path: false
        preserve_host: false
        protocols:
          - https
        https_redirect_status_code: 301
    plugins:
      #- name: rate-limiting    # rimuovere il plugin per mostrare i finding del 4.1 (rate limiting)
      #  config:
      #    minute: 100          # soglia: 100 request al minuto per IP
      #    policy: local        # contatore in RAM, unica opzione in DB-less
      #    limit_by: ip         # chiave = IP TCP reale, non X-Forwarded-For
      #    hide_client_headers: false  # espone X-RateLimit-* e Retry-After
      #    fault_tolerant: true        # se il contatore è irraggiungibile, passa
      - name: response-transformer
        config:
          add:
            headers:
              - "Strict-Transport-Security: max-age=31536000; includeSubDomains"
              - "Content-Security-Policy: default-src 'self'"
              - "Permissions-Policy: geolocation=(), camera=(), microphone=()"
          replace:
            headers:
              - "X-Content-Type-Options: nosniff"
              - "X-Frame-Options: DENY"
          remove:
            headers:
              - "X-Powered-By"

  # ---------------------------------------------------------------------------
  # Dummy service created exclusively for the Test 3.3 HMAC audit.
  #
  # Purpose: the hmac-auth plugin requires a service/route to be registered,
  # but attaching it to forgejo-service would break all existing tests that
  # use Bearer tokens (Kong would reject them for lacking an HMAC signature).
  # By attaching it to an unreachable path, the plugin is discoverable via
  # GET /plugins (Admin API) without affecting any real traffic.
  #
  # Test 3.3 reads the full plugin list from the Admin API and audits the
  # hmac-auth config regardless of which service it is attached to.
  #
  # To produce FAIL findings (useful for thesis documentation):
  #   set clock_skew: 600         (exceeds 300s oracle -> FAIL)
  #   add hmac-sha1 / hmac-md5 to algorithms (deprecated/broken -> FAIL)
  # ---------------------------------------------------------------------------
  - name: hmac-audit-dummy
    url: http://forgejo-upstream
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: hmac-audit-route
        paths:
          - /hmac-audit-probe-not-a-real-path
        strip_path: false
    plugins:
      - name: hmac-auth
        config:
          clock_skew: 300               # compliant: <= 300 s (NIST SP 800-107 Rev.1 S5.3.2)
          algorithms:
            - hmac-sha256
            - hmac-sha384
            - hmac-sha512
          validate_request_body: true   # body included in signature (recommended for POST/PUT)