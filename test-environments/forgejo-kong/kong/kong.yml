_format_version: "3.0"

upstreams:
  - name: forgejo-upstream
    targets:
      - target: forgejo:3000
        weight: 100
    healthchecks:
      # Active checks only probe a target that is already unhealthy (healthy.interval: 0), every 5 s, and
      # re-enable it after one successful probe: passive checks alone never re-enable a target (Q-66,
      # https://developer.konghq.com/gateway/traffic-control/health-checks-circuit-breakers/).
      active:
        type: http
        http_path: /api/healthz
        healthy:
          interval: 0
          successes: 1
        unhealthy:
          interval: 5
      passive:
        type: http
        healthy:
          successes: 2
        unhealthy:
          http_failures: 5
          timeouts: 3
          http_statuses:
            - 500
            - 502
            - 503
            - 504

services:
  - name: forgejo-service
    # url points at the upstream, not directly at forgejo:3000, so the upstream's
    # health checks and timeouts apply (test 4.3 reads them).
    url: http://forgejo-upstream
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: forgejo-api-route
        paths:
          - /api
        strip_path: false
        preserve_host: false
        # HTTPS only; an HTTP request gets a 301 to the same path over HTTPS (test 1.5), and a path
        # that no route matches gets Kong's 404 on both listeners (test 0.2). Kong's documented
        # redirect: https://developer.konghq.com/support/how-configure-kong-to-redirect-http-traffic-to-https/
        protocols:
          - https
        https_redirect_status_code: 301
      # Forgejo's OpenAPI specification, the only path outside /api (the tool downloads it from here:
      # Forgejo publishes no port). Exact match: a Kong path starting with "~" is a regular expression
      # (https://developer.konghq.com/gateway/routing/traditional/, example "~/foo/bar$").
      - name: forgejo-spec-route
        paths:
          - '~/swagger\.v1\.json$'
        strip_path: false
        preserve_host: false
        protocols:
          - https
        https_redirect_status_code: 301
    plugins:
      # Not enabled: the lab has no rate limit, so test 4.1 reports it. Uncomment to see the test pass
      # (its page, section 12).
      #- name: rate-limiting
      #  config:
      #    minute: 5            # 5 requests per minute
      #    policy: local        # counter in each node's memory (cluster needs a database)
      #    limit_by: ip         # the client address Kong determines: the TCP peer, unless trusted_ips
      #                         # and real_ip_header make it take a header
      #    hide_client_headers: false  # send X-RateLimit-* and Retry-After
      #    fault_tolerant: true        # Kong's default: proxy the request when the counter is unreachable
      - name: response-transformer
        config:
          add:
            headers:
              - "Strict-Transport-Security: max-age=31536000; includeSubDomains"
              - "Content-Security-Policy: default-src 'self'"
              - "Permissions-Policy: geolocation=(), camera=(), microphone=()"
              # Set whether or not the backend sends them: `add` covers a backend that
              # does not (crAPI's community service), `replace` one that sends its own
              # value (Forgejo's SAMEORIGIN). In Kong `add` only sets a header that is
              # absent and `replace` only one that is present
              # (kong/plugins/response-transformer/header_transformer.lua).
              - "X-Content-Type-Options: nosniff"
              - "X-Frame-Options: DENY"
          replace:
            headers:
              - "X-Content-Type-Options: nosniff"
              - "X-Frame-Options: DENY"
          remove:
            headers:
              - "X-Powered-By"

  # ---------------------------------------------------------------------------
  # Dummy service created exclusively for the Test 3.3 HMAC audit.
  #
  # Purpose: the hmac-auth plugin requires a service/route to be registered,
  # but attaching it to forgejo-service would break all existing tests that
  # use Bearer tokens (Kong would reject them for lacking an HMAC signature).
  # By attaching it to an unreachable path, the plugin is discoverable via
  # GET /plugins (Admin API) without affecting any real traffic.
  #
  # Test 3.3 reads the full plugin list from the Admin API and audits the
  # hmac-auth config regardless of which service it is attached to.
  #
  # To produce FAIL findings:
  #   set clock_skew: 600         (above the 300 s bound -> REPLAY_WINDOW_TOO_LARGE)
  #   set anonymous: <consumer>   (a request without a signature passes -> SIGNATURE_OPTIONAL)
  # As written, no enforce_headers: Kong checks the clock skew on X-Date or Date and requires
  # neither in the signature, so test 3.3 reports REPLAY_DATE_NOT_SIGNED (add
  # `enforce_headers: [date, x-date]` to see it pass). Kong accepts only hmac-sha1/256/384/512,
  # so the default forbidden algorithm (md5) cannot be configured here.
  # ---------------------------------------------------------------------------
  - name: hmac-audit-dummy
    url: http://forgejo-upstream
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: hmac-audit-route
        paths:
          - /hmac-audit-probe-not-a-real-path
        strip_path: false
    plugins:
      - name: hmac-auth
        config:
          clock_skew: 300               # within the methodology's 300 s bound (no standard sets it)
          algorithms:
            - hmac-sha256
            - hmac-sha384
            - hmac-sha512
          validate_request_body: true   # the Digest header is checked against the body; it is
                                        # signed only when `digest` is in enforce_headers