# test-environments/forgejo-kong/config.yaml
#
# Configuration for the Forgejo + Kong lab: Forgejo 14.0.5 behind Kong 3.9.3 (DB-less). Start the lab
# first (docs/project/maintainer-commands.md, "Test Labs"), then run the tool from the repository root:
#   hatch run apiguard run -c test-environments/forgejo-kong/config.yaml
# Relative paths in this file are resolved against the directory the command is run from (the
# repository root). Credentials come from .env.
#
# Only the lab's own values are here; every other key keeps its default. The complete configuration,
# with every key and its description, is config.example.yaml in the repository root.

target:
  base_url: "https://localhost:8443"
  # Kong's certificate is signed by the labs' authority (test-environments/pki, created at the lab's
  # start): verified with it. To lower the level: remove ca_bundle and set verify: false (not
  # verified: the report says so); with no tls block the system's authorities are used and the
  # lab certificate is refused.
  tls:
    ca_bundle: test-environments/pki/ca.crt

  # Requests to the API: timeouts in seconds, attempts after a transport error.
  connect_timeout: 5.0
  read_timeout: 30.0
  max_retry_attempts: 3

  # Resources created by the lab setup (forgejo-setup, from .env), so that parametric paths reach
  # real objects.
  path_seed: {
    # === CORE ===
    # Lab values come from .env: the lab setup creates these resources with the
    # same variables (test-environments/forgejo-kong/docker-compose.yml).
    owner: "${USER_A_USERNAME}",
    username: "${USER_A_USERNAME}",
    user: "${USER_A_USERNAME}",
    repo: "${LAB_TEST_REPO}",
    repo_name: "${LAB_TEST_REPO}",

    # === NUMERIC IDS ===
    "user-id": "2",
    "repository-id": "1",
    id: "1",          

    # === ORGANIZATION (created by the lab setup) ===
    org: "${LAB_TEST_ORG}",   # {org} != {owner}

    # === GIT ===
    branch: "main",
    ref: "main",
    sha: "main",       # Forgejo accepts a branch name where a commit SHA is expected
    filepath: "README.md",
    archive: "main.tar.gz",

    # === OTHERS ===
    name: "MIT",
    index: "1",        # issue 1, created by the lab setup
    tag: "${LAB_TEST_TAG}",
    comment: "1",      # comment 1, created by the lab setup
    team: "1",         # "Owners" team of the organization, created with it

    # === ADVANCED PARAMETERS (often for disabled features) ===
    "activity-id": "1",
    "attachment_id": "1",
    "run_id": "1",
    task: "1",
    secretname: "MY_SECRET",
    variablename: "MY_VAR",
    workflowfilename: "main.yml",
    quotagroup: "default",
    quotarule: "default",
    token: "1",
    version: "1.0.0",
    pageName: "Home",
    basehead: "main...main",
    base: "main",
    head: "main",
    diffType: "diff",
    flag: "fork",
    collaborator: "user-b",
    target: "user-b",
    identifier: "1",
    position: "1",
    type: "gitea",
    template_owner: "user-a",
    template_repo: "test-repo",
    topic: "forgejo",
  }

specification:
  # Served by Forgejo through Kong (route forgejo-spec-route, kong/kong.yml): Forgejo publishes no
  # port. Same authority as the API; a local copy (path:) needs no connection.
  url: "https://localhost:8443/swagger.v1.json"
  timeout: 60.0
  tls:
    ca_bundle: test-environments/pki/ca.crt

gateway:
  adapter: kong
  admin:
    # Kong's HTTPS Admin API (127.0.0.1 only), verified with the labs' authority. Kong OSS has no
    # client certificate or key for the Admin API. To lower the level: url "http://localhost:8001"
    # and no tls block (plain HTTP: the report says so).
    url: "https://localhost:8444"
    tls:
      ca_bundle: test-environments/pki/ca.crt

credentials:
  # Login with the resource forgejo-token below: the tool creates a Forgejo API token per
  # account and deletes it at the end of the run.
  auth_type: login
  login_resource: forgejo-token
  # Forgejo declares several schemes; tokens go in "Authorization: token <value>"
  # (AuthorizationHeaderToken; the "token " prefix is described only in words).
  security_scheme: AuthorizationHeaderToken
  send_as:
    prefix: "token "
  admin_username: "${ADMIN_USERNAME}"
  admin_password: "${ADMIN_PASSWORD}"
  user_a_username: "${USER_A_USERNAME}"
  user_a_password: "${USER_A_PASSWORD}"
  user_b_username: "${USER_B_USERNAME}"
  user_b_password: "${USER_B_PASSWORD}"

# What the tool creates on Forgejo and deletes at the end of the run.
resources:
  # Login of every account (credentials.login_resource): a Forgejo API token created with
  # Basic Auth, deleted at the end of the run; test 1.4 revokes one by deleting it.
  forgejo-token:
    create:
      path: "/api/v1/users/{username}/tokens"
      auth: basic
      body:
        name: "apiguard-{random}"
        scopes: ["read:repository", "read:user", "write:repository", "write:user"]
    values:
      credential: sha1
      id: id
    delete:
      path: "/api/v1/users/{username}/tokens/{id}"
      auth: basic
  # Repository for test 7.2's webhooks, created as user A; its webhooks go with it.
  repository:
    create:
      path: /api/v1/user/repos
      body:
        name: "apiguard-repo-{random}"
        description: "APIGuard SSRF assessment -- webhook injection probe"
        private: true
        auto_init: true
    values:
      owner: owner.login
      repo: name
    delete:
      path: "/api/v1/repos/{owner}/{repo}"

# What runs: every test by default, native and external (same in the three labs).
# To run only a part, change one line:
#   min_priority   3 = all; 0 = P0 only, 1 = P0-P1, 2 = P0-P2
#   strategies     remove one to exclude its tests (e.g. only BLACK_BOX: no credentials used)
#   test_ids       e.g. ["1.4", "7.2", "ext.1.5.sslyze"]: only these (replaces the two filters above)
#   external_tools.enabled: false (below): no external test, a run of a minute or two
execution:
  min_priority: 3
  strategies:
    - BLACK_BOX
    - GREY_BOX
    - WHITE_BOX
  test_ids: []
  fail_fast: false

output:
  directory: "outputs/forgejo"

# Test review (branch test-review): the parameters of the tests not rewritten yet are commented out;
# each block returns, uncommented, with its test (docs/project/test-review.md).
tests:
  domain_1:
    test_1_5:
      # The lab puts HTTPS on 8443 and the plain-HTTP listener (Kong) on 8000, so
      # deriving the HTTP origin from base_url would hit http://localhost:8443,
      # Kong's TLS port. Only the origin is used; the path is derived from the spec.
      http_url: "http://localhost:8000"
  domain_2:
    # 2.2 (BOLA) and 2.5 (object property level) create a disposable object owned
    # by user_a through the `repository` resource (private repo), attack it as
    # user_b, and delete it.
    test_2_2:
      owned_object_resources: [repository]
    test_2_5:
      owned_object_resources: [repository]
