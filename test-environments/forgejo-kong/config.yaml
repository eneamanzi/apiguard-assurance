# External tools (installed by install_tools.sh): all three, about 5 minutes more.
external_tools:
  # Master switch: false skips every external test in one line.
  enabled: true
  schemathesis:
    # Schema-driven validation (ext.3.1.schemathesis), unauthenticated. Needs the
    # [schemathesis] extra. max_examples kept low to bound the run.
    enabled: true
    timeout_seconds: 600
    max_examples: 3
  # Each tool can also be switched off alone (enabled: false).
  testssl:
    enabled: true
    timeout_seconds: 180
    # --connect-timeout 10: a target that accepts TCP but never completes TLS cannot stall a check.
    extra_flags: "--quiet --color 0 --connect-timeout 10"
    expected_version: "3.2.3"
  nuclei:
    enabled: true
    timeout_seconds: 600
    expected_version: "3.8.0"
  sslyze:
    enabled: true
    timeout_seconds: 60
  # ffuf, path search (ext.0.1.ffuf): unauthenticated GET only, about 1 minute on this lab.
  ffuf:
    enabled: true
    timeout_seconds: 600
    expected_version: "2.3.0"
