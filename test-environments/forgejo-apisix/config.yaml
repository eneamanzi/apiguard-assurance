# test-environments/forgejo-apisix/config.yaml
#
# Configuration for the Forgejo + APISIX lab: Forgejo 14.0.5 behind Apache APISIX 3.19.0. Start the lab
# first (docs/project/maintainer-commands.md, "Test Labs"), then run the tool from the repository root:
#   hatch run apiguard run -c test-environments/forgejo-apisix/config.yaml
# Relative paths in this file are resolved against the directory the command is run from (the
# repository root). Credentials and the Admin API key come from .env.
#
# The API, its users and test resources are those of the Forgejo + Kong lab, and so are the settings
# below that are not about the gateway (test-environments/forgejo-kong/config.yaml), so that the
# results of the two labs can be compared. Every other key keeps its default (all keys, with
# their description: config.example.yaml in the repository root).

target:
  base_url: "https://localhost:10443"
  # APISIX's certificate is signed by the labs' authority (test-environments/pki, created at the
  # lab's start): verified with it. To lower the level: remove ca_bundle and set verify: false (not
  # verified: the report says so); with no tls block the system's authorities are used and the
  # lab certificate is refused.
  tls:
    ca_bundle: test-environments/pki/ca.crt

  # Requests to the API: timeouts in seconds, attempts after a transport error.
  connect_timeout: 5.0
  read_timeout: 30.0
  max_retry_attempts: 3

  # Same resources as the Forgejo + Kong lab (created by forgejo-setup).
  path_seed: {
    owner: "${USER_A_USERNAME}",
    username: "${USER_A_USERNAME}",
    user: "${USER_A_USERNAME}",
    repo: "${LAB_TEST_REPO}",
    repo_name: "${LAB_TEST_REPO}",
    "user-id": "2",
    "repository-id": "1",
    id: "1",
    org: "${LAB_TEST_ORG}",   # {org} != {owner}
    branch: "main",
    ref: "main",
    sha: "main",       # Forgejo accepts a branch name where a commit SHA is expected
    filepath: "README.md",
    archive: "main.tar.gz",
    name: "MIT",
    index: "1",        # issue 1, created by the lab setup
    tag: "${LAB_TEST_TAG}",
    comment: "1",      # comment 1, created by the lab setup
    team: "1",         # "Owners" team of the organization, created with it
    "activity-id": "1",
    "attachment_id": "1",
    "run_id": "1",
    task: "1",
    secretname: "MY_SECRET",
    variablename: "MY_VAR",
    workflowfilename: "main.yml",
    quotagroup: "default",
    quotarule: "default",
    token: "1",
    version: "1.0.0",
    pageName: "Home",
    basehead: "main...main",
    base: "main",
    head: "main",
    diffType: "diff",
    flag: "fork",
    collaborator: "user-b",
    target: "user-b",
    identifier: "1",
    position: "1",
    type: "gitea",
    template_owner: "user-a",
    template_repo: "test-repo",
    topic: "forgejo",
  }

specification:
  # Served by Forgejo through APISIX (route forgejo-spec-route, apisix/setup.sh): Forgejo publishes
  # no port. Same authority as the API; a local copy (path:) needs no connection.
  url: "https://localhost:10443/swagger.v1.json"
  timeout: 60.0
  tls:
    ca_bundle: test-environments/pki/ca.crt

gateway:
  adapter: apisix
  admin:
    # APISIX Admin API over HTTPS with mutual TLS (127.0.0.1 only, apisix/config.yaml): APISIX's
    # certificate verified with the labs' authority, the tool's client certificate, then the key.
    # Lowering the level here also means changing APISIX's configuration (https_admin and
    # admin_api_mtls in apisix/config.yaml, then a lab restart).
    url: "https://127.0.0.1:10001"
    tls:
      ca_bundle: test-environments/pki/ca.crt
      client_cert: test-environments/pki/client.crt
      client_key: test-environments/pki/client.key
    # APISIX Admin API key of role viewer (GET only).
    headers:
      X-API-KEY: "${APISIX_VIEWER_KEY}"
  # APISIX Control API: live health of the upstream nodes (test 4.3). Plain HTTP: APISIX offers
  # no TLS on it (no key either); it listens on 127.0.0.1 only.
  health:
    url: "http://127.0.0.1:10002"

credentials:
  # Login with the resource forgejo-token below: the tool creates a Forgejo API token per
  # account and deletes it at the end of the run.
  auth_type: login
  login_resource: forgejo-token
  # Forgejo declares several schemes; tokens go in "Authorization: token <value>"
  # (AuthorizationHeaderToken; the "token " prefix is described only in words).
  security_scheme: AuthorizationHeaderToken
  send_as:
    prefix: "token "
  admin_username: "${ADMIN_USERNAME}"
  admin_password: "${ADMIN_PASSWORD}"
  user_a_username: "${USER_A_USERNAME}"
  user_a_password: "${USER_A_PASSWORD}"
  user_b_username: "${USER_B_USERNAME}"
  user_b_password: "${USER_B_PASSWORD}"

# What the tool creates on Forgejo and deletes at the end of the run.
resources:
  # Login of every account (credentials.login_resource): a Forgejo API token created with
  # Basic Auth, deleted at the end of the run; test 1.4 revokes one by deleting it.
  forgejo-token:
    create:
      path: "/api/v1/users/{username}/tokens"
      auth: basic
      body:
        name: "apiguard-{random}"
        scopes: ["read:repository", "read:user", "write:repository", "write:user"]
    values:
      credential: sha1
      id: id
    delete:
      path: "/api/v1/users/{username}/tokens/{id}"
      auth: basic
  # Repository for test 7.2's webhooks, created as user A; its webhooks go with it.
  repository:
    create:
      path: /api/v1/user/repos
      body:
        name: "apiguard-repo-{random}"
        description: "APIGuard SSRF assessment -- webhook injection probe"
        private: true
        auto_init: true
    values:
      owner: owner.login
      repo: name
    delete:
      path: "/api/v1/repos/{owner}/{repo}"

# What runs: every test by default, native and external (same in the three labs).
# To run only a part, change one line:
#   min_priority   3 = all; 0 = P0 only, 1 = P0-P1, 2 = P0-P2
#   strategies     remove one to exclude its tests (e.g. only BLACK_BOX: no credentials used)
#   test_ids       e.g. ["1.4", "7.2", "ext.1.5.sslyze"]: only these (replaces the two filters above)
#   external_tools.enabled: false (below): no external test, a run of a minute or two
execution:
  min_priority: 3
  strategies:
    - BLACK_BOX
    - GREY_BOX
    - WHITE_BOX
  test_ids: []
  fail_fast: false

output:
  directory: "outputs/forgejo-apisix"

tests:
  domain_0:
    test_0_2:
      # The defaults plus APISIX, which answers with "Server: APISIX".
      gateway_server_identifiers:
        - "kong"
        - "nginx"
        - "openresty"
        - "apache"
        - "caddy"
        - "traefik"
        - "envoy"
        - "apisix"
  domain_1:
    test_1_4:
      # Sent with the revoked token: Forgejo's profile of the authenticated user.
      verify_request:
        method: GET
        path: /api/v1/user
    test_1_5:
      # The lab's HTTP listener (APISIX, host port 10000) redirects to HTTPS.
      http_probe_url: "http://localhost:10000/api/v1/version"
  domain_2:
    test_2_1:
      # Forgejo admin-only endpoint, as in the Forgejo + Kong lab.
      admin_endpoint_paths:
        - "/api/v1/admin/users"
      admin_endpoint_method: "GET"
  domain_6:
    test_6_4:
      # Body of APISIX's own 404 (no route matched): {"error_msg":"404 Route Not Found"}.
      gateway_block_body_fragment: "404 Route Not Found"
      # Same paths as the Forgejo + Kong lab.
      debug_endpoint_paths:
        - /api/v1/settings/api
        - /api/debug/config
        - /api/debug/users
        - /actuator/env
        - /actuator/configprops
        - /actuator/health
        - /debug/vars
        - /debug/pprof
        - /api/config
        - /admin/config
        - /_debug

  domain_7:
    test_7_2:
      # Forgejo webhooks, as in the Forgejo + Kong lab: the resource 'repository' is created first.
      injection_resource: repository
      injection_path_template: "/api/v1/repos/{owner}/{repo}/hooks"
      injection_body_template:
        type: "forgejo"
        config:
          url: "{ssrf_url}"
          content_type: "json"
          secret: "{random_secret}"
        events:
          - "push"
        active: false
        branch_filter: "*"

# External tools (installed by install_tools.sh): all three, about 5 minutes more.
external_tools:
  # Master switch: false skips every external test in one line.
  enabled: true
  # Each tool can also be switched off alone (enabled: false).
  testssl:
    enabled: true
    timeout_seconds: 180
    # --connect-timeout 10: a target that accepts TCP but never completes TLS cannot stall a check.
    extra_flags: "--quiet --color 0 --connect-timeout 10"
    expected_version: "3.2.3"
  nuclei:
    enabled: true
    timeout_seconds: 240
    expected_version: "3.8.0"
  sslyze:
    enabled: true
    timeout_seconds: 60
