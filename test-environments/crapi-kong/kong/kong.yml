_format_version: "3.0"

# Kong declarative configuration of the cRAPI lab.
#
# Same gateway configuration as the Forgejo lab (test-environments/forgejo-kong/kong/kong.yml):
# passive health checks, timeouts, security headers, the HTTP-to-HTTPS redirect and the hmac-auth
# audit service. Only the backend changes, so that a different result between the two
# labs comes from the API, not from the gateway.
#
# API routes accept HTTPS only: an HTTP request gets a 301 to the same path over HTTPS (test 1.5), and a
# path that no route matches gets Kong's 404 on both listeners (test 0.2), as in the Forgejo lab
# (https://developer.konghq.com/support/how-configure-kong-to-redirect-http-traffic-to-https/).
#
# Routing follows Kong's pattern for microservices (one service per backend, one route per path
# prefix, strip_path: false): cRAPI's services serve their full paths (/identity/api/...,
# /community/api/..., /workshop/api/...), as crAPI's own web front end (crapi-web, not used here)
# forwards them unchanged. https://developer.konghq.com/gateway/entities/route/

upstreams:
  - name: identity-upstream
    targets:
      - target: crapi-identity:8080
        weight: 100
    healthchecks:
      # Active checks only probe a target that is already unhealthy (healthy.interval: 0), every 5 s, and
      # re-enable it after one successful probe: passive checks alone never re-enable a target (Q-66,
      # https://developer.konghq.com/gateway/traffic-control/health-checks-circuit-breakers/).
      active:
        type: http
        http_path: /identity/health_check
        healthy:
          interval: 0
          successes: 1
        unhealthy:
          interval: 5
      passive:
        type: http
        healthy:
          successes: 2
        unhealthy:
          http_failures: 5
          timeouts: 3
          http_statuses:
            - 500
            - 502
            - 503
            - 504
  - name: community-upstream
    targets:
      - target: crapi-community:8087
        weight: 100
    healthchecks:
      # Active checks only probe a target that is already unhealthy (healthy.interval: 0), every 5 s, and
      # re-enable it after one successful probe: passive checks alone never re-enable a target (Q-66,
      # https://developer.konghq.com/gateway/traffic-control/health-checks-circuit-breakers/).
      active:
        type: http
        http_path: /community/home
        healthy:
          interval: 0
          successes: 1
        unhealthy:
          interval: 5
      passive:
        type: http
        healthy:
          successes: 2
        unhealthy:
          http_failures: 5
          timeouts: 3
          http_statuses:
            - 500
            - 502
            - 503
            - 504
  - name: workshop-upstream
    targets:
      - target: crapi-workshop:8000
        weight: 100
    healthchecks:
      # Active checks only probe a target that is already unhealthy (healthy.interval: 0), every 5 s, and
      # re-enable it after one successful probe: passive checks alone never re-enable a target (Q-66,
      # https://developer.konghq.com/gateway/traffic-control/health-checks-circuit-breakers/).
      active:
        type: http
        http_path: /workshop/health_check/
        healthy:
          interval: 0
          successes: 1
        unhealthy:
          interval: 5
      passive:
        type: http
        healthy:
          successes: 2
        unhealthy:
          http_failures: 5
          timeouts: 3
          http_statuses:
            - 500
            - 502
            - 503
            - 504

services:
  - name: identity-service
    url: http://identity-upstream
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: identity-route
        paths:
          - /identity
        strip_path: false
        preserve_host: false
        protocols:
          - https
        https_redirect_status_code: 301
    plugins: &security-headers
      - name: response-transformer
        config:
          add:
            headers:
              - "Strict-Transport-Security: max-age=31536000; includeSubDomains"
              - "Content-Security-Policy: default-src 'self'"
              - "Permissions-Policy: geolocation=(), camera=(), microphone=()"
          replace:
            headers:
              - "X-Content-Type-Options: nosniff"
              - "X-Frame-Options: DENY"
          remove:
            headers:
              - "X-Powered-By"

  - name: community-service
    url: http://community-upstream
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: community-route
        paths:
          - /community
        strip_path: false
        preserve_host: false
        protocols:
          - https
        https_redirect_status_code: 301
    plugins: *security-headers

  - name: workshop-service
    url: http://workshop-upstream
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: workshop-route
        paths:
          - /workshop
        strip_path: false
        preserve_host: false
        protocols:
          - https
        https_redirect_status_code: 301
    plugins: *security-headers

  # Service that only carries an hmac-auth plugin for the test 3.3 audit, on a path no client uses
  # (attaching hmac-auth to an API service would make every Bearer request fail).
  - name: hmac-audit-dummy
    url: http://identity-upstream
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: hmac-audit-route
        paths:
          - /hmac-audit-probe-not-a-real-path
        strip_path: false
    plugins:
      - name: hmac-auth
        config:
          clock_skew: 300
          algorithms:
            - hmac-sha256
            - hmac-sha384
            - hmac-sha512
          validate_request_body: true
