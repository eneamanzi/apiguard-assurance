# test-environments/crapi-kong/config.yaml
#
# Configuration for the cRAPI lab: OWASP crAPI 1.1.6 behind Kong. Start the lab first
# (docs/project/maintainer-commands.md, "Test Labs"), then run the tool from the repository root:
#   hatch run apiguard run -c test-environments/crapi-kong/config.yaml
# Relative paths in this file are resolved against the directory the command is run from (the
# repository root). Credentials come from .env (CRAPI_* variables).
#
# Execution settings are the same as the Forgejo lab's configuration
# (test-environments/forgejo-kong/config.yaml), so that the results of the two labs can be
# compared; only the target-specific settings differ. Every other key keeps its default (all keys, with
# their description: config.example.yaml in the repository root).

target:
  base_url: "https://localhost:9443"
  # Kong's certificate is signed by the labs' authority (test-environments/pki, created at the lab's
  # start): verified with it. To lower the level: remove ca_bundle and set verify: false (not
  # verified: the report says so); with no tls block the system's authorities are used and the
  # lab certificate is refused.
  tls:
    ca_bundle: test-environments/pki/ca.crt

  # Requests to the API: timeouts in seconds, attempts after a transport error.
  connect_timeout: 5.0
  read_timeout: 30.0
  max_retry_attempts: 3

specification:
  # crAPI 1.1.6 specification, stored in the lab (see test-environments/crapi-kong/NOTICE.md).
  path: "./test-environments/crapi-kong/crapi-openapi-spec.json"
  timeout: 60.0

gateway:
  adapter: kong
  admin:
    # Kong's HTTPS Admin API (127.0.0.1 only), verified with the labs' authority. Kong OSS has no
    # client certificate or key for the Admin API. To lower the level: url "http://localhost:9001"
    # and no tls block (plain HTTP: the report says so).
    url: "https://localhost:9444"
    tls:
      ca_bundle: test-environments/pki/ca.crt

credentials:
  # crAPI logs in with POST /identity/api/auth/login {"email", "password"} -> {"token"}
  # (resource crapi-login below).
  auth_type: login
  login_resource: crapi-login

  admin_username: "${CRAPI_ADMIN_EMAIL}"
  admin_password: "${CRAPI_ADMIN_PASSWORD}"
  user_a_username: "${CRAPI_USER_A_EMAIL}"
  user_a_password: "${CRAPI_USER_A_PASSWORD}"
  user_b_username: "${CRAPI_USER_B_EMAIL}"
  user_b_password: "${CRAPI_USER_B_PASSWORD}"

# What the tool creates on crAPI: only the login (a JWT, nothing to delete; crAPI has no
# logout, so test 1.4 is not applicable).
resources:
  crapi-login:
    create:
      path: /identity/api/auth/login
      auth: none
      body:
        email: "{username}"
        password: "{password}"
    values:
      credential: token

# What runs: every test by default, native and external (same in the three labs).
# To run only a part, change one line:
#   min_priority   3 = all; 0 = P0 only, 1 = P0-P1, 2 = P0-P2
#   strategies     remove one to exclude its tests (e.g. only BLACK_BOX: no credentials used)
#   test_ids       e.g. ["1.4", "7.2", "ext.1.5.sslyze"]: only these (replaces the two filters above)
#   external_tools.enabled: false (below): no external test, a run of a minute or two
execution:
  min_priority: 3
  strategies:
    - BLACK_BOX
    - GREY_BOX
    - WHITE_BOX
  test_ids: []
  fail_fast: false

output:
  directory: "outputs/crapi"

tests:
  domain_1:
    test_1_5:
      # The lab's HTTP listener (Kong, host port 9000) redirects to HTTPS.
      http_url: "http://localhost:9000/identity/api/auth/jwks.json"
  domain_7:
    test_7_2:
      # crAPI's "contact mechanic" endpoint makes the server call the URL in mechanic_api.
      url_accepting_endpoint:
        path: "/workshop/api/merchant/contact_mechanic"
        body:
          mechanic_api: "{ssrf_url}"
          problem_details: "APIGuard SSRF assessment probe"
          mechanic_code: "TRAC_1"
          number_of_repeats: 1
          repeat_request_if_failed: false
          vin: "3W2H568SN8025H9WA"

# External tools (installed by install_tools.sh): all three, about 5 minutes more.
external_tools:
  # Master switch: false skips every external test in one line.
  enabled: true
  # Each tool can also be switched off alone (enabled: false).
  testssl:
    enabled: true
    timeout_seconds: 180
    # --connect-timeout 10: a target that accepts TCP but never completes TLS cannot stall a check.
    extra_flags: "--quiet --color 0 --connect-timeout 10"
    expected_version: "3.2.3"
  nuclei:
    enabled: true
    timeout_seconds: 240
    expected_version: "3.8.0"
  sslyze:
    enabled: true
    timeout_seconds: 60
