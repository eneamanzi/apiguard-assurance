# config.example.yaml
#
# Complete configuration of APIGuard Assurance: every key, with its description and its default.
# Copy it, keep what your target needs, and run:
#   apiguard validate-config -c my-config.yaml
#   apiguard run -c my-config.yaml
# A key left out takes its default. Reference: docs/reference/configuration.md; guided setup:
# docs/guides/usage/configure-a-target.md. The test labs hold only their own values
# (test-environments/*/config.yaml).
#
# Values written as ${...} with an uppercase variable name come from environment variables (or the
# .env file of the working directory, or --env-file). Never write a credential in clear here. Such a
# placeholder without a value stops the tool, even inside a comment: the commented examples below
# show <...> instead; write the placeholder when you uncomment them.
# Relative paths are resolved against the directory the command is run from.
#
# Alternatives that cannot be active together are shown commented out (e.g. specification.url or
# specification.path). `hatch run dev:check` verifies that this file lists every key
# (scripts/check_config_keys.py).

# =============================================================================
# TARGET
# =============================================================================
target:
  # Base URL of the API, as the clients reach it (through the gateway).
  base_url: "https://api.example.com"

  # Certificate settings of this connection (also used by the HTTP probe of test 1.5); the same block exists in specification, gateway.admin
  # and gateway.health. Absent: the operating system's authorities plus certifi's list.
  #   verify       false accepts any server certificate (an impostor too); not with ca_bundle
  #   ca_bundle    PEM file of the authorities to trust instead (e.g. the company authority)
  #   client_cert  the tool's certificate, for a server that asks for mutual TLS (PEM)
  #   client_key   its private key (PEM, not encrypted, readable only by you), with client_cert
  # tls:
    # verify: true
    # ca_bundle: "certs/company-ca.pem"
    # client_cert: "certs/apiguard.crt"
    # client_key: "certs/apiguard.key"

  # Requests to the API: timeouts in seconds, attempts after a transport error.
  connect_timeout: 5.0
  read_timeout: 30.0
  max_retry_attempts: 3

  # Real identifiers of existing resources, by path parameter name, so that probes on
  # /items/{id} reach the authentication check instead of a 404. Generate the names with
  #   apiguard generate-seed <spec url or path> -o seed.yaml
  # Parameters left out take "1" (or "apiguard-probe" for DELETE probes). Default: none.
  path_seed: {}
  #   Example:
  #     owner: "user-a"
  #     id: "42"

# =============================================================================
# SPECIFICATION
# =============================================================================
# The OpenAPI specification of the API (Swagger 2.0 or OpenAPI 3.x): exactly one of url and path.
specification:
  url: "https://api.example.com/openapi.json"
  # path: "./specs/openapi.json"
  # Time allowed to load it (download and $ref resolution), in seconds.
  timeout: 60.0
  # Certificate settings of the download (see target.tls).
  # tls:
    # verify: true
    # ca_bundle: "certs/company-ca.pem"
    # client_cert: "certs/apiguard.crt"
    # client_key: "certs/apiguard.key"

# =============================================================================
# GATEWAY
# =============================================================================
# The API gateway, for the configuration audits (WHITE_BOX: 3.3, 4.2, 4.3, 6.4 sub-test B).
# Without this section those tests return SKIP. Adapters: kong (Kong 3.x), apisix (Apache APISIX 3.x).
# gateway:
  # adapter: kong
  # admin:
    # url: "https://127.0.0.1:8444"
    # Headers sent on every Admin API request, for a gateway that protects it (APISIX: X-API-KEY;
    # a key of role viewer, GET only, is enough). Values from placeholders, masked in every output.
    # headers: {X-API-KEY: "<APISIX viewer key placeholder>"}
    # Timeouts of the Admin API and health API requests, in seconds. Defaults 5.0 and 10.0.
    # connect_timeout: 5.0
    # read_timeout: 10.0
    # Certificate settings of the Admin API (see target.tls); e.g. APISIX with mutual TLS.
    # tls:
      # verify: true
      # ca_bundle: "certs/internal-ca.pem"
      # client_cert: "certs/apiguard.crt"
      # client_key: "certs/apiguard.key"
  # Interface reporting the live health of the backends, when the gateway keeps it outside the
  # Admin API (APISIX: Control API). Not used by Kong. Read without the Admin API headers.
  # health:
    # url: "http://127.0.0.1:9090"
    # tls:
      # verify: true
      # ca_bundle: "certs/internal-ca.pem"
      # client_cert: "certs/apiguard.crt"
      # client_key: "certs/apiguard.key"

# =============================================================================
# CREDENTIALS
# =============================================================================
# Accounts the tests log in with: admin (the API's administrator, test 1.4), user_a (an ordinary
# account, tests 2.1 and 7.2), user_b (a second ordinary account, reserved). Without them those
# tests return SKIP.
credentials:
  # How a credential is obtained; required when an account or a token is configured:
  #   basic          HTTP Basic with username and password;
  #   static_token   the <role>_token values below;
  #   login          the prepared resource login_resource (see resources) is created for each
  #                  account: its value "credential" is the token; with a delete request, the
  #                  token is deleted at the end of the run and test 1.4 can revoke one.
  auth_type: login
  login_resource: api-login

  # Accounts (basic, login): username and password together.
  admin_username: "${MYAPI_ADMIN_USERNAME}"
  admin_password: "${MYAPI_ADMIN_PASSWORD}"
  user_a_username: "${MYAPI_USER_A_USERNAME}"
  user_a_password: "${MYAPI_USER_A_PASSWORD}"
  # user_b_username: "<placeholder>"
  # user_b_password: "<placeholder>"

  # Tokens (static_token only, instead of the accounts above).
  # admin_token: "<placeholder>"
  # user_a_token: "<placeholder>"
  # user_b_token: "<placeholder>"

  # How the credential is sent. It comes from the security schemes the specification declares:
  # one scheme is used as is; with several, name it here; with none, describe it in send_as.
  # Not with basic (always "Authorization: Basic ...").
  # security_scheme: "bearerAuth"

  # Completes or replaces the declared scheme. Every field left out comes from the scheme.
  #   in      header, query or cookie (required, with name, when no scheme is declared)
  #   name    header, query parameter or cookie name
  #   prefix  written before the credential, spaces included (an apiKey scheme whose prefix
  #           is described only in words, e.g. Forgejo: "token ")
  # send_as:
    # in: header
    # name: "X-Api-Key"
    # prefix: "Token "

# =============================================================================
# RESOURCES
# =============================================================================
# Prepared resources: what the tool creates on the target and deletes at the end of the run,
# referred to by name (letters, digits, "_", "-"). None by default.
# Each resource has a create request, values taken from its JSON response (name: dotted path)
# and an optional delete request. A request has a path, an optional JSON body, a method
# (create POST, delete DELETE by default) and an auth:
#   credential  the credential of the role the resource is created for (default)
#   basic       HTTP Basic with that role's username and password
#   none        nothing
# Placeholders, always in quotes: {username} and {password} (the role's account), {random}
# (8 hexadecimal characters, the same in create and delete); in delete also the value names.
resources:
  # The login of credentials.login_resource: a JSON login whose response holds the token.
  api-login:
    create:
      path: "/auth/login"
      auth: none
      body:
        username: "{username}"
        password: "{password}"
    values:
      credential: "access_token"
  # A resource for test 7.2 (injection_resource), created as user A and deleted at the end.
  # repository:
    # create:
      # method: POST
      # path: "/api/repos"
      # body:
        # name: "apiguard-{random}"
        # private: true
    # values:
      # repo_id: "id"
    # delete:
      # method: DELETE
      # auth: credential
      # path: "/api/repos/{repo_id}"

# =============================================================================
# EXECUTION
# =============================================================================
execution:
  # Highest priority included: 0 = P0 only ... 3 = all (default).
  min_priority: 3
  # BLACK_BOX (network only), GREY_BOX (an ordinary account), WHITE_BOX (administrator and gateway).
  strategies:
    - BLACK_BOX
    - GREY_BOX
    - WHITE_BOX
  # Only these tests (e.g. ["1.1", "ext.1.5.testssl"]); empty = all selected by the two keys above.
  test_ids: []
  # Stop at the first P0 test that returns FAIL or ERROR.
  fail_fast: false

# =============================================================================
# OUTPUT
# =============================================================================
output:
  # Reports, evidence and tool outputs; created if missing. One directory per run is safest.
  directory: "outputs"

# =============================================================================
# TESTS (every value below is the default)
# =============================================================================
# Generated from the tests' parameter models (scripts/generate_docs.py, hatch run dev:gen).
# [[[cog import generate_docs as g; cog.out(g.example_tests()) ]]]
tests:
  domain_0:
    # 0.1 All Exposed Endpoints Are Documented and Authorized.
    test_0_1:
      # Number of documented endpoints (in spec order) used by the undeclared-method sub-check;
      # parametric ones among them are skipped.
      method_probe_sample_size: 10
    # 0.2 Gateway Deny-by-Default on Unregistered Paths.
    test_0_2:
      # Substrings matched case-insensitively against the 'Server' response header to classify a
      # response as generated by the API Gateway layer (not the backend).
      gateway_server_identifiers:
        - kong
        - nginx
        - openresty
        - apache
        - caddy
        - traefik
        - envoy
    # 0.3 Deprecated APIs Are Disabled or Under Enhanced Monitoring: no parameters.
    test_0_3: {}

  domain_1:
    # 1.1 Only Authenticated Requests Access Protected Resources.
    test_1_1:
      # Maximum number of protected endpoints that Test 1.1 will probe.
      max_endpoints_cap: 0
    # 1.4 Revoked Token Rejected After Deletion.
    test_1_4:
      # An endpoint of the API that requires authentication: method (default GET) and path.
      # protected_endpoint:
        # method: GET
        # path: /api/me
    # 1.5 Credentials Not Transmitted via Insecure Channels.
    test_1_5:
      # Minimum acceptable max-age value (seconds) in the Strict-Transport-Security header.
      hsts_min_max_age_seconds: 31536000
      # If True, probe the HTTP base URL for redirect enforcement (sub-test 1).
      http_probe_enabled: true
      # A URL of the API in plain HTTP, checked for a redirect to HTTPS (sub-test 1).
      http_url: ''
      # Connect + read timeout (seconds) for the HTTP redirect probe.
      http_probe_timeout_seconds: 5.0
      # HTTP status codes that satisfy the redirect oracle in sub-test 1.
      expected_redirect_status_codes:
        - 301
        - 308
    # 1.6 Secure Session Management in Distributed Architectures.
    test_1_6:
      # Paths of the API that set session cookies, read with a GET to collect them.
      session_cookie_paths:
        - /
      # Case-insensitive cookie names treated as session identifiers.
      session_cookie_names:
        - session
        - sid
        - PHPSESSID
        - JSESSIONID
        - connect.sid
        - _session
        - auth_session
        - user_session
      # If True, validate the SameSite attribute on session cookies.
      check_samesite: true
      # Expected value for the SameSite cookie attribute (case-insensitive).
      expected_samesite_value: Strict

  domain_2:
    # 2.1 Only Authorized Users Access Privileged Endpoints.
    test_2_1:
      # Admin-only endpoint paths of the target to probe with a non-privileged token (OWASP ASVS
      # v5.0.0 V8.3.1), each starting with '/'.
      admin_endpoint_paths: []
      # Example:
      # admin_endpoint_paths:
        # - /api/admin/users
      # HTTP method to use when probing each admin endpoint.
      admin_endpoint_method: GET

  domain_3:
    # 3.3 HMAC Authentication Configuration Does Not Allow Replay or Weak Algorithms.
    test_3_3:
      # Maximum acceptable replay window (in seconds) of a signing policy (the allowed difference
      # between the request's date and the gateway's clock).
      max_clock_skew_seconds: 300
      # HMAC algorithms whose presence in a signing policy's allowed list constitutes a security
      # finding.
      forbidden_algorithms:
        - hmac-sha1
        - hmac-md5

  domain_4:
    # 4.1 Rate Limiting -- Resource Exhaustion Prevention.
    test_4_1:
      # Maximum probe requests sent before concluding rate limiting is absent.
      max_requests: 150
      # Interval in milliseconds between consecutive probe requests.
      request_interval_ms: 50
    # 4.2 Timeout Configuration Audit -- Prevention of Resource Lock.
    test_4_2:
      # Maximum acceptable backend connect timeout of a gateway service, in milliseconds.
      max_connect_timeout_ms: 5000
      # Maximum acceptable backend read timeout of a gateway service, in milliseconds.
      max_read_timeout_ms: 30000
      # Maximum acceptable backend write (send) timeout of a gateway service, in milliseconds.
      max_write_timeout_ms: 30000
    # 4.3 Circuit Breaker Audit -- Dual-Check a 3 Livelli.
    test_4_3:
      # Minimum acceptable failure threshold to open the circuit.
      failure_threshold_min: 3
      # Maximum acceptable failure threshold to open the circuit.
      failure_threshold_max: 10
      # Minimum acceptable Open-state duration in seconds before Half-Open probe.
      timeout_duration_min_seconds: 30
      # Maximum acceptable Open-state duration in seconds before Half-Open probe.
      timeout_duration_max_seconds: 120
      # Maximum acceptable value for unhealthy.http_failures in an upstream's passive healthcheck.
      passive_hc_max_http_failures: 10
      # Maximum acceptable value for unhealthy.tcp_failures in an upstream's passive healthcheck.
      passive_hc_max_tcp_failures: 10
      # Maximum acceptable value for unhealthy.timeouts in an upstream's passive healthcheck.
      passive_hc_max_timeouts: 10

  domain_6:
    # 6.2 Security Headers Configured Appropriately.
    test_6_2:
      # Minimum acceptable max-age value in the Strict-Transport-Security header.
      hsts_min_max_age_seconds: 31536000
      # Number of endpoints to sample for cross-endpoint header consistency check.
      endpoint_sample_size: 5
    # 6.4 Service Credentials Not Hardcoded or Exposed.
    test_6_4:
      # List of paths to probe for debug / actuator endpoint exposure.
      debug_endpoint_paths:
        - /actuator/env
        - /actuator/configprops
        - /actuator/health
        - /debug/vars
        - /debug/pprof
        - /api/config
        - /admin/config
        - /_debug
        - /api/debug/users
        - /api/debug/config
      # A substring present in the response body of a non-2xx reply produced by the Gateway itself
      # (deny-by-default), as opposed to a reply forwarded to and rejected by the upstream
      # application.
      gateway_block_body_fragment: no Route matched with those values

  domain_7:
    # 7.2 Server-Side Request Forgery (SSRF) Prevention.
    test_7_2:
      # Payload categories to include in the SSRF probe.
      payload_categories:
        - cloud_metadata
        - private_ip
        - encoding_bypass
        - forbidden_protocol
        - dns_bypass
        - url_parser_confusion
      # An endpoint of the API that accepts a URL from the client and makes the server call it (a
      # webhook, an import from a URL): path, body and, optionally, a prepared resource.
      # url_accepting_endpoint:
        # path: /api/repos/{repo_id}/hooks
        # body:
          # callback_url: '{ssrf_url}'
        # resource: repository
      # URL of an operator-controlled public server that responds with 302 Location pointing to an
      # internal SSRF target (e.g. http://169.254.169.254/...).
      ssrf_redirect_server_url: ''
      # Case-insensitive substrings checked against the response body of non-2xx SSRF probe
      # responses.
      ssrf_block_response_keywords:
        - invalid host
        - not allowed
        - forbidden
        - scheme not supported
        - scheme not allowed
        - host not allowed
        - private
        - loopback
        - blocked
        - disallowed
        - restricted
      # Case-insensitive substrings that, when found in a non-2xx SSRF probe response body, indicate
      # the URL was rejected because it is syntactically invalid to the HTTP parser -- NOT because
      # of an explicit SSRF defence and NOT because the scheme is unsupported.
      ssrf_malformed_url_keywords:
        - invalid character
        - invalid url
        - url malformed
        - malformed url
        - parse error
        - url parse
        - could not parse
        - bad url
      # Case-insensitive substrings that, when found in a non-2xx SSRF probe response body, indicate
      # the URL was rejected because its scheme (protocol) is not accepted by the application -- NOT
      # because the URL is syntactically malformed and NOT because of an explicit SSRF IP/range
      # defence.
      ssrf_unsupported_scheme_keywords:
        - scheme not supported
        - scheme not allowed
        - unsupported scheme
        - unsupported protocol
        - invalid scheme
        - only http
        - only https
        - protocol not allowed
      # Intended timeout in milliseconds for individual SSRF probe requests.
      ssrf_request_timeout_ms: 10000
# [[[end]]]

# =============================================================================
# EXTERNAL TOOLS (installed by install_tools.sh; off by default)
# =============================================================================
external_tools:
  # Master switch for every external test.
  enabled: true
  # testssl.sh, TLS analysis (ext.1.5.testssl). timeout_seconds is required when enabled.
  testssl:
    enabled: false
    timeout_seconds: 180
    expected_version: "3.2.3"
    extra_flags: "--quiet --color 0"
    # Reuse cached output instead of running the tool: never in a real assessment.
    dev_mode: false
  # nuclei, template scan (ext.0.1.nuclei).
  nuclei:
    enabled: false
    timeout_seconds: 240
    expected_version: "3.8.0"
    template_dir: "./tools/nuclei-templates"
    tags:
      - "api"
      - "exposure"
      - "misconfig"
      - "panel"
    # Per-request timeout (seconds) and request rate (per second).
    per_request_timeout: 10
    rate_limit_rps: 30
    extra_flags: ""
    dev_mode: false
  # sslyze, TLS analysis as a Python library (ext.1.5.sslyze; pip install "apiguard-assurance[sslyze]").
  sslyze:
    enabled: false
    timeout_seconds: 60
    # expected_version: "6.3.1"
    dev_mode: false
